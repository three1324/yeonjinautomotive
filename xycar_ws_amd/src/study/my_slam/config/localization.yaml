# slam_toolbox 측위 모드 — 만들어둔 지도 위에서 현재 위치를 추정한다.
#
# 사용:  ros2 launch my_slam localization.launch.py map:=/경로/track_map
#
# 출발위치: 매핑을 출발선에서 시작했다면 지도 원점 (0,0,0) 이 곧 출발 위치다.
#           규정상 출발 위치가 고정이므로 아래 map_start_pose 를 그대로 쓰면 된다.
#           차를 출발선에 정확히 놓고 시작할 것.
slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: localization

    # map_file_name 은 launch 가 인자로 채운다 (확장자 없는 경로)
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]   # [x, y, yaw] — 출발선 = 지도 원점

    resolution: 0.05
    max_laser_range: 10.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    transform_publish_period: 0.02
    transform_timeout: 0.2

    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
