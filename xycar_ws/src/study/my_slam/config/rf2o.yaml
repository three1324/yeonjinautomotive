# rf2o_laser_odometry — 연속된 라이다 스캔을 비교해 이동량(odom)을 추정한다.
#
# 왜 쓰나: 휠 오도메트리(vesc_to_odom)는 타이어 슬립에 취약하고, RC카는 코너에서
#          슬립이 잦다. 라이다 스캔매칭은 슬립과 무관하다.
# 한계  : 특징 없는 개활지에서는 실패한다. 대회장은 벽/기둥/책상이 많아 유리한 편.
#
# 2단계 확장: rf2o + vesc odom + imu 를 EKF(robot_localization)로 융합.
#             지금은 rf2o 단독으로 먼저 지도 품질을 재보고 판단한다.
#             (검증 안 된 vesc odom 을 섞으면 멀쩡한 rf2o 를 오염시킨다)
/**:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    publish_tf: true
    base_frame_id: base_link
    odom_frame_id: odom
    # 빈 문자열 = 시작 위치를 (0,0,0) 으로 고정.
    # 이 성질을 이용해 "출발선에서 매핑 시작 -> 지도 원점 = 출발 위치" 로 만든다.
    init_pose_from_topic: ""
    freq: 20.0
    verbose: false
