# robot_localization EKF — 2단계 확장용. 지금은 사용하지 않는다.
#
# 언제 켜나: rf2o 단독으로 매핑했을 때 지도 품질이 부족하면, 증상에 따라 켠다.
#   - 회전 구간에서 지도가 뒤틀림      -> IMU 융합이 효과적
#   - 직진 구간에서 거리가 안 맞음     -> 휠 오도메트리(vesc) 융합이 효과적
#   무턱대고 셋 다 넣지 말고 어긋나는 축을 보고 필요한 것만 켤 것.
#
# 켜는 법: ros2 launch my_slam mapping.launch.py use_ekf:=true
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 라이다 오도메트리 — x, y, yaw
    odom0: /odom_rf2o
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # 휠 오도메트리 (vesc_to_odom) — 속도만 신뢰 [실측 wheelbase 확인 후 활성화]
    odom1: /odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false

    # IMU — 각속도만 (자세는 실내 자기교란 때문에 신뢰하지 않는다)
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
