# ============================================================================
#  AMD 보드 xycar(서울대 대회 차량) 전용 덧씌우기 파라미터
#
#  적용:  ros2 launch my_bringup drive_amd.launch.py
#         (drive_params.yaml 을 먼저 읽고 이 파일이 그 위를 덮는다)
#
#  ⚠️ 이 파일에는 **차량이 달라서 값이 달라지는 것만** 넣는다.
#     알고리즘 튜닝값(차선 피팅, 신호등 투표, 조향 게인 등)은 전부
#     drive_params.yaml 한 곳에만 두어 두 차량이 같은 값을 공유하게 한다.
#     여기에 복사해오면 그 순간부터 두 파일이 갈라져 관리가 안 된다.
#
#  여기 없는 노드 섹션(perception_node, obstacle_node)은 의도적으로 비워둔 것이다.
#  카메라 토픽(/image_raw), 라이다 토픽(/scan), 해상도(640x480)가 젯슨 차량과
#  동일한 것을 서울대 백업 소스에서 확인했으므로 덮을 것이 없다.
#    - race_lane_yolo/config/race_lane_yolo.yaml : width 640 / height 480
#    - race_lidar/config/race_lidar.yaml         : scan_topic '/scan'
#    - race_bringup/launch/race.launch.py        : input_image_topic '/image_raw'
# ============================================================================

driver_node:
  ros__parameters:
    # [실측 2026-08-18] AMD 차량 실차 테스트에서 "가다 멈추고" 반복 확인.
    # 원인: YOLO 가 CUDA 없이 CPU 추론이라(§1 GPU 없음) 프레임마다 처리시간이
    # 젯슨보다 훨씬 길고 들쭉날쭉하다. 기본 stale_timeout_sec=0.5(드라이버 인지 데이터
    # 끊김 판정 기준)를 못 맞추는 프레임이 나오면 driver_node 가 매번 halt() 를 불러
    # "느린 인지 주기 == 반복 정지"가 된다. perception_node 로그의 실측 fps 를 보고
    # 그 역수의 여유배(약 2배)로 넉넉히 잡을 것 — 너무 늘리면 진짜 인지 두절도 못 잡는다.
    # 예: 3fps 라면 주기 0.33s, stale_timeout 을 0.8~1.0s 정도로.
    # 실측 fps 확인 후 이 값을 맞춰 넣을 것 (지금은 임시로 1.0s).
    stale_timeout_sec: 1.0
    speed:
      # --- 왜 속도만 다시 잡는가 ---
      # 토픽 계약은 양쪽이 같다: xycar_motor 에 [angle, speed], angle 은 ±50.
      # 하지만 speed 의 **실효 배율**이 다르다.
      #
      #   젯슨 차량 : 우리가 만든 xycar_motor 노드가 speed 를 VESC ERPM 으로 변환.
      #               speed_weight=0.08, ERPM 상한 10000/gain 4614 = 2.17 m/s
      #               -> speed 27 이 물리적 상한이었다.
      #   AMD 차량 : 모터 드라이버가 별도 ROS1 도커 안의 **벤더 노드**다.
      #               우리가 그 변환식을 통제하지 못한다.
      #
      # 그래서 실측 근거가 있는 쪽을 따른다. 같은 AMD 차량에서 돌린 서울대
      # race_lane_planning/config/race_lane_planning.yaml 에 이렇게 적혀 있다:
      #     base_speed: 4.8   # 기존 12.0의 40% (실차 속도 하향)
      #     min_speed:  2.0   # 기존 5.0의 40%
      # 즉 이 차량에서는 12.0 이 실주행에 너무 빨라 40% 로 낮춰 쓴 이력이 있다.
      # 우리 기본값도 12.0 이므로 그대로 올리면 2.5배 빠르게 나간다.
      #
      # [2026-08-18 재조정] base 를 10.0 으로 올림 (테스트 목적).
      # min/limit/accel_per_sec 는 원래 base=4.8 대비 비율(min/base, limit/base,
      # accel/base)을 그대로 유지하도록 동일 배율(10.0/4.8 ≈ 2.0833)로 스케일.
      # ⚠️ 미검증 값이다. 실차에서 12.0 이 이미 "너무 빠름"으로 확인된 이력이
      #   있으므로(위 근거 참고) 처음 주행은 저속 구간/직선에서 먼저 확인할 것.
      base: 10.0
      min: 4.2                # 2.0 * (10.0/4.8)
      limit: 25.0              # 12.0 * (10.0/4.8)
      accel_per_sec: 16.7      # 8.0 * (10.0/4.8)
      # decel_per_sec 는 덮지 않는다 — 감속은 빠를수록 안전하므로 60.0 을 그대로 쓴다.
      #
      # stop_dist / slow_dist / curve_* / quality_* / cone_* 도 덮지 않는다.
      # 거리는 미터(물리량)라 차량이 바뀌어도 같고, 나머지는 비율이라 그대로 유효하다.

    # --- 조향 게인은 일부러 덮지 않는다 ---
    # angle 범위(±50)가 같아 그대로 유효하다. 다만 속도가 40% 로 낮아지면 같은
    # 조향각에서 거리당 회전이 커져 체감 응답이 달라질 수 있다.
    # 실주행에서 진동하면 drive_params.yaml 의 steer.k_lat 을 낮추는 것이 아니라
    # **이 파일에 steer 섹션을 추가해서** 덮을 것 (젯슨 값을 건드리지 말 것).
    steer:
      # [실측 2026-08-18] AMD 차량 실차 테스트에서 조향이 반대로 나옴 확인.
      # drive_params.yaml 기본값(false)은 젯슨 차량 기준. 원인은 차량마다 다를 수
      # 있다 — 카메라 offset 부호 규약, 서보 링키지 방향, 또는 ROS1 벤더
      # xycar_motor.py 가 auto_drive_vesc() 에서 -steer_val 로 한 번 더 뒤집는 것
      # 등. 원인 규명보다 실측이 우선이라 여기서 바로 뒤집는다.
      invert: true
