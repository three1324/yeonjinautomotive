# ============================================================================
#  주행 파라미터 통합 파일
#  이 파일 하나만 고치면 인지/판단/제어 전부 조정된다.
#
#  적용:  ros2 launch my_bringup drive.launch.py
#         (다른 파일을 쓰려면  params_file:=/경로/내파일.yaml)
#
#  형식 주의: ROS2 파라미터 yaml 은 **중첩 구조**로 쓴다.
#             노드에서 "lane.y_lo" 로 선언한 파라미터는 아래처럼 중첩해야 한다.
#                 lane:
#                   y_lo: 270
#             평면으로 "lane.y_lo: 270" 이라고 쓰면 파서가 다르게 해석할 수 있다.
#
#  표기:
#    [실측]  실차에서 반드시 측정해서 넣어야 하는 값. 안 하면 동작이 틀어진다.
#    [튜닝]  실주행 보며 맞추는 값
#    [측정]  영상 분석으로 근거가 확보된 값 (reference/perception_analysis.md)
#    [고정]  근거가 명확해 건드릴 일이 거의 없는 값
# ============================================================================

# ---------------------------------------------------------------------------
#  인지 — 카메라 (YOLO11n-seg 1회 추론)
# ---------------------------------------------------------------------------
perception_node:
  ros__parameters:
    # model_path 는 launch 가 설치 경로로 채워준다. 직접 쓰려면 절대경로.
    model_path: ""
    image_topic: "/image_raw"

    # --- 클래스별 신뢰도 임계값 ---
    infer_conf: 0.20        # [고정] YOLO 자체 임계값. 낮게 두고 아래에서 클래스별로 거른다
    dashed_conf: 0.40       # [측정] 노란 점선. 임계값 0.7까지 올려도 검출률 96% 유지될 만큼 견고
    solid_conf: 0.25        # [측정] 흰 실선. 어두운 구간에서 conf 0.33까지 떨어져 낮게 잡는다
    cone_conf: 0.30         # [튜닝]
    car_conf: 0.40          # [튜닝] 오검출이 추월을 유발하면 올릴 것

    # --- 차선 추정 (lane.py) ---
    # 목표는 "차로 중심"이 아니라 "트랙 중앙"이다. 노란 점선이 트랙 정중앙과
    # 일치하는 것이 338표본으로 확인됨 (오차 +3.0px).
    lane:
      y_lo: 270             # [측정] 샘플 시작행. 지평선 아래
      y_hi: 425             # [측정] 샘플 끝행. 차체(검은 원형)에 가려지는 하단 위
      eval_near: 380
      # ↑ [튜닝 2026-08-19] 400 -> 380. 400 은 y_hi(425) 바로 앞이라 사실상
      #   외삽이었다. 380 이면 표본 범위 270~425 안쪽으로 들어와 내삽이 된다.
      eval_far: 290
      # ↑ [사용자 결정 2026-08-22 — **되돌림**] 290 -> 280 으로 더 멀리
      #   보게 했다가 **290 으로 원복**했다. (이력: 310 -> 290 -> 280 -> 290)
      #   작을수록(화면 위쪽) 더 멀리 본다 — 곱선을 일찍 알아채 선행
      #   감속·선행 조향이 빨라진다. 대신 표본이 얇아져 조향이 떨린다.
      #
      #   ⚠️ **여기가 사실상 한계다.** y_lo(270) 에서 10px 밖에 안 떨어져
      #      있어 표본이 얇고, 지평선 근처라 원근 압축으로 픽셀 노이즈가 크다.
      #      더 멀리 보려면 y_lo 를 같이 내려야 하는데, 그러면 지평선 위가
      #      표본에 들어와 차선이 아닌 것을 차선으로 잎는다.
      #      조향을 더 “멀리 보는” 느낌으로 만들고 싶으면 여기 대신
      #      **steer.k_curve** 를 올리는 편이 안전하다 — 같은 far 항을
      #      더 무겁게 쓰는 것이라 표본 노이즈를 늘리지 않는다.
      #   ⚠️ |far-near| 가 커지면 speed.curve_px_hi(150) 에 더 자주 걸려
      #      곱선 감속도 깊어진다. 조향이 떨리면 290~310 으로 되돌릴 것.
      center_bias_px: 0.0
      # ↑ [사용자 결정 2026-08-22] -15.0 -> **0.0 으로 되돌림**.
      #   좌측 쏠림 보정을 여기서 하지 않기로 했다 — 이 값은 카메라 경로
      #   에만 걸려서 **라바콘 구간(라이다)에는 적용되지 않는다.**
      #   원인이 조향 트림/기계적 비대칭이면 두 구간 모두에 걸리는
      #   전역 보정이 필요하고, 그건 별도로 정한다.
      #
      #   [의미] **카메라 장착 편차 보정 = 차량 중심선이 화면 어디에 찍히는가.**
      #   기준선 target = width/2 + center_bias_px 이고, 디버그 화면의 파란
      #   세로선이 바로 이 위치다(2026-08-21 부터 값이 반영된다 — 그전에는
      #   width/2 로 하드코딩돼 있어 바꿔도 선이 안 움직였다).
      #
      #   ★ 부호를 헷갈리기 쉽다. 이건 조준점이 아니라 "차 중심선의 위치"다.
      #     평형은 c_near = width/2 + bias 이므로:
      #         bias 음수 -> 차는 트랙의 더 **오른쪽**에 선다
      #         bias 양수 -> 차는 더 **왼쪽**
      #     즉 "차를 오른쪽으로" = **음수**다. 파란 선이 움직인 방향과 차가
      #     가는 방향이 반대인 것이 정상이다.
      #
      #   맞추는 법 두 가지 (둘 중 편한 쪽):
      #     (a) 눈으로: debug 화면을 띄우고 파란 선이 실제 차량 정중앙에
      #         올 때까지 값을 넣는다. 재시작 없이 바로 반영된다:
      #             ros2 param set /perception_node lane.center_bias_px -20.0
      #     (b) 수치로: 차를 트랙 정중앙에 세워두고 perception 로그의 offset
      #         값을 읽어 그대로 넣는다 (그러면 그 자세에서 offset 이 0 이 된다).
      #
      #   ⚠️ 이 값이 틀리면 조향이 **한쪽으로 계통적으로 치우친다.** 게인으로
      #      잡으려 하지 말 것 — 게인은 편차를 못 없애고 진동만 늘린다.
      left_band_px: 30.0
      # ↑ ★ [2026-08-22 신규] 좌회전(지름길) 전용 — 행별로 **가장 왼쪽
      #   노란픽셀에서 이 폭 안쪽만** 남겨 따로 한 벌 더 추정한다.
      #   그 결과가 /lane 의 offset_*_left 이고, driver_node 가 SHORTCUT
      #   상태에서만 쓴다. **평소 주행에는 아무 영향이 없다.**
      #
      #   왜 필요한가: 분기점에서는 dashed 마스크에 직진 가지와 좌회전 가지가
      #   **둘 다** 들어온다. 전부 평균내면 그 사이를 겨냥해 어느 쪽도 못 탄다.
      #   왼쪽 밴드만 쓰면 좌회전 가지가 선택되고, 좌회전을 마친 뒤에는
      #   합류 차선을 그대로 따라간다.
      #
      #   행별로 자르는 이유: 전체 최소 x 하나로 자르면 원근 때문에 먼 행이
      #   통째로 탈락한다(먼 행일수록 x 가 화면 중앙에 몰린다).
      #
      #   [합성 검증] 직진(x=330 고정) + 좌회전(위로 갈수록 왼쪽) 두 가지가
      #   같이 보이는 프레임에서, 전방행(y=310) 목표가
      #       전체 평균 278.2  ->  좌측밴드 226.4   (51.8px 더 왼쪽)
      #   ⚠️ 너무 좁으면 노란선 두께보다 작아져 픽셀이 모자라 피팅이 실패한다
      #      (min_pts 50). 너무 넓으면 직진 가지가 다시 섞인다.
      min_pts: 50           # [고정] 피팅에 필요한 최소 픽셀 수
      min_span: 20          # [고정] y 범위가 좁으면 2차 피팅이 폭주하므로 하한
      hold_frames: 15       # [튜닝] 차선 결측 시 직전 값을 유지할 프레임 수
      half_alpha: 0.05      # [고정] 행별 트랙 반폭 EMA 계수
      # --- 이상치 방어 (2026-08-17 추가) ---
      # 피팅이 실패하면 말도 안 되는 값이 나온다. 실측(테스트영상 428프레임):
      #     |offset| 최대 746px, 프레임간 변화 최대 1158px
      # 극단값은 quality 0.9(노란선만 보임) 경로에서 나온다. 급커브에서 좌우
      # 경계선이 번갈아 사라질 때, 화면 밖으로 나가는 부분을 외삽하다가
      # 2차 다항식이 발산하기 때문이다.
      #
      # 적용 효과 (480/250 기준):
      #     |offset| 최대   746 -> 448 px  (40% 감소)
      #     프레임간 최대  1158 -> 249 px  (78% 감소)
      #     차선 유효율    100% 유지 (기각되면 hold가 받쳐줌)
      #
      # ⚠️ 더 조이면 오히려 나빠진다. 기각이 늘어 hold가 길어지고,
      #    풀린 뒤 한 번에 크게 점프한다 (350/150 -> 변화 최대 425px).
      max_center_offset_px: 480.0
      # ↑ [튜닝] 화면 중심에서 이만큼 넘게 벗어난 추정은 피팅 실패로 보고 기각.
      #   화면 폭(640)의 75% 수준. 급커브에서 트랙이 화면 가장자리로 가는 건
      #   정상이지만 그 이상은 외삽 발산이다.
      max_jump_px: 250.0
      # ↑ [튜닝] 직전 채택값에서 이만큼 넘게 튄 추정은 기각.
      #   둘 중 이쪽이 주력이다 (단독으로 1158 -> 249 를 잡음).

    # --- 신호등 투표 (light_vote.py) ---
    # 켜진 LED가 흰색으로 포화되어 색 판별은 불가능하다. 위치(몇 번째 램프)로만
    # 구분되며, 그 판독률이 거리에 의존한다: 박스폭 ~80px 68% / 110px+ 94%.
    # 그래서 단일 프레임을 믿지 않고 누적 투표한다.
    light:
      window: 30            # [튜닝] 투표 창 크기. 30fps 기준 30 = 1초
      min_weight: 3.0       # [튜닝] 확정에 필요한 가중치 합. 높을수록 신중(느림)
      # ⚠️ 절벽 주의. start_sim.py 측정: 6.0 까지는 정상이지만
      #   10.0 에서 3000회 중 1485회가 **10초 안에 출발 못 함**.
      #   출발 대기 위치는 conf 0.54 라 가중치가 잘 안 쌓인다.
      #   "신중하게" 올릴 값이 아니다. 6.0 을 넘기지 말 것.
      min_ratio: 0.6        # [측정] 1위 상태가 차지해야 할 비율
      # ↑ 0.5 -> 0.6. tools/start_sim.py 5000회 몬테카를로:
      #   빨간불 오검출이 전부 GREEN 으로 튀는 최악 가정에서
      #     0.5 -> 조기출발 48회 (실격 위험),  0.6 -> 1회
      #   비용은 출발 지연 +0.14s (p95 0.83 -> 0.97s). 싼 보험이다.
      #   0.6 이상 올려도 조기출발은 더 안 줄고 지연만 늘어난다.
      miss_tolerance: 10    # [튜닝] 이 프레임 수만큼 연속으로 신호등을 못 봐야 NONE

      # --- 좌회전(LEFT) 전용 문턱 (2026-08-22 신규) ---
      # [사용자 결정] 좌회전 신호를 **더 잘 읽도록** 낮춘다.
      #   min_weight 3.0  -> LEFT 는 1.5
      #   min_ratio  0.6  -> LEFT 는 0.45
      #
      # ★ 공통값(min_weight/min_ratio)을 낮추지 않고 LEFT 만 분리한 이유:
      #   공통값을 낮추면 **GREEN 오검출로 빨간불에 출발**하는 위험이 같이
      #   커진다. start_sim.py 5000회 몬테카를로에서 min_ratio 0.6 -> 0.5 로
      #   낮추자 조기출발이 1회 -> 48회로 뛰었다(실격 위험). LEFT 는 그
      #   실패 모드와 무관하므로 여기만 따로 낮춘다.
      #
      # ⚠️ 공짜는 아니다. LEFT 오검출은 차를 좌회전 분기로 보내고,
      #    돌아오는 데 fsm.shortcut_total_sec(15초)가 걸린다. 오발동이
      #    보이면 이 둘을 올리거나 fsm.shortcut_confirm_frames 를 올릴 것.
      min_weight_left: 1.5
      min_ratio_left: 0.45

    log_period_sec: 2.0
    publish_debug_image: false

# ---------------------------------------------------------------------------
#  라바콘 구간 전담 — /scan 으로 콘 복도를 찾아 /cone_cmd 를 만든다
#
#  이 노드는 자족적이다: /scan 을 직접 받아 조향·속도까지 다 만든다. 차선·
#  카메라와 엮이지 않는다. **구간 판정만은 driver_node 가 카메라(YOLO 콘
#  개수)로 하고**, 구간이면 이 노드의 명령을 xycar_motor 로 그대로 통과시킨다.
#
#  ⚠️ [2026-08-22] 실측 치수가 확정되면서 기하 로직을 개편했다. 원본(팀원이
#     실차에서 성공시킨 구현)은 `pairing_mode: nearest_pair` 로 그대로 남아
#     있고, 새 경로가 이상하면 재시작 없이 되돌릴 수 있다.
#     바뀐 것과 근거: my_obstacle/my_obstacle/rubbercone_node.py 상단 docstring.
#     실차 bag 이 없어 합성 검증으로 대신했다: my_obstacle/tools/synth_check.py
# ---------------------------------------------------------------------------
rubbercone_node:
  ros__parameters:
    # ══════════════════════════════════════════════════════════════════
    #  ★★ [2026-08-23] 실차 확인된 기준선 — 함부로 바꾸지 말 것 ★★
    #
    #  사용자 확인: "지금 라이다 괜찮다, 일단 이걸로 돌리자."
    #  라바콘 구간이 실차에서 납득할 만하게 도는 것을 확인한 시점의 값이다.
    #  **튜닝이 나빠지면 여기로 되돌아온다.**
    #
    #  이 상태가 되기까지 무엇을 왜 바꿨는지, 증상별 첫 수는 전부
    #      reference/2026-08-23_rubbercone_baseline.md
    #  에 정리돼 있다. 값 하나 만지기 전에 그것부터 읽을 것.
    #
    #  핵심 셋 (이 조합이 조향 부족을 풀었다):
    #      range_max_m: 2.50         ROI 확장 — 양벽이 동시에 보이게
    #      목표점 스무딩 제거          EMA + clamp 가 조향 지연의 원인이었다
    #      pursuit_ref_offset_m: 0.14  Pure Pursuit 기준점을 앞으로
    #
    #  ⚠️ 이 노드는 파라미터를 __init__ 에서 **한 번만** 읽는다.
    #     ros2 param set 은 안 먹는다(예외: pairing_mode). 값을 바꾸려면
    #     이 파일을 고치고 노드를 재시작할 것.
    # ══════════════════════════════════════════════════════════════════

    # ★ 가장 중요한 설정 — 모터 토픽에 직접 쏘지 않게 돌린다.
    #   원본 기본값은 'xycar_motor' 였다(원본 주석: "decision_node 생기면 변경").
    #   우리가 바로 그 decision_node 다. 이걸 안 바꾸면 driver_node 와 둘이
    #   같은 토픽에 서로 다른 명령을 쏴서 차가 요동친다.
    drive_topic: cone_cmd
    zone_topic: /cone_zone_active   # driver_node 가 mux 판단에 쓴다
    scan_topic: scan
    debug_topic: /rubbercone/debug_image

    angle_offset_deg: 0.0     # [실측필요] 라이다 장착 각도 보정

    # --- 시각화 (2026-08-22) ---
    # 라바콘 구간에서 보고 싶은 것은 점 구름이 아니라 **어느 콘이 어느 벽으로
    # 배정됐는가** 다. 그래서 콘 하나를 큰 점 하나로 내고, 원시 스캔은 뺀다.
    cone_marker_topic: "/rubbercone/cones"
    cone_marker_size_m: 0.12  # 실제 콘 지름 0.10 보다 살짝 크게 — 겹쳐도 보이게
    debug_show_scan_points: false
    # ↑ /rubbercone/debug_image 에 ROI 스캔점(회색)을 함께 그릴지.
    #   기본 false. 콘이 하나도 안 잡힐 때 "스캔은 오는데 필터에서 떨어지는
    #   건지"를 확인할 때만 잠깐 켠다:
    #       ros2 param set /rubbercone_node debug_show_scan_points true
    #   ※ 생성자에서 한 번만 읽으므로 재시작이 필요하다.

    # ══════════════════════════════════════════════════════════════════
    # [2026-08-22] 실측 치수 확정 -> 아래 값 전부 그 위에서 재계산됨
    #
    #     콘 단면 지름(라이다 높이)  D = 0.10 m
    #     같은 줄 콘 중심 간격        P = 0.425 m  (실측 2026-08-22)
    #     같은 줄 한 칸 건너          P*2 = 0.85 m ★ W(0.80)와 5cm 차이뿐
    #     좌우 콘 중심 간 거리        W = 0.80 m   (통과폭 0.70 + D)
    #     차폭 0.30 -> **좌우 여유 0.20 m 씩**
    #     라이다 -> 뒤축              0.41 m
    #     코스: S자(좌-우-좌), 반파장 약 1.5m, 중심선 반경 R ~ 1.0~1.5m
    #
    # 코스나 콘이 바뀌면 **이 6줄부터 다시 재고**, 아래 값을 재계산할 것.
    # 근거와 검산은 my_obstacle/my_obstacle/geometry.py docstring 에 있다.
    # 검증: python3 my_obstacle/tools/synth_check.py  (실차 bag 이 없어 합성)
    # ══════════════════════════════════════════════════════════════════

    # --- 관심영역: 직사각형(전방 x, 폭 |y|) + 거리 상한 ---
    # 옛 부채꼴(max_angle_deg=100)은 사실상 반원이라 옆·뒤 벽을 다 끌어왔다.
    # 그렇다고 직사각형으로만 자르면 **커브 안쪽 벽이 잘린다** — 안쪽 벽은 y가
    # 가파르게 오르기 때문(검산: 좌벽이 1개만 남아 편측 폴백으로 떨어졌다).
    # 그래서 거리 상한을 얹어 모서리를 깎았다. 커브에서는 "얼마나 앞"이 아니라
    # "얼마나 가까이"가 올바른 경계다.
    forward_min: 0.15
    side_half_m: 2.50   # 사실상 무효 (= range_max_m). 아래 [2026-08-22] 참고
    range_max_m: 2.50   # [작도 2026-08-22] 1.40 -> 2.50
    #
    # ★ [2026-08-22] 굽이가 깊은 코스에서 **한쪽 벽이 통째로 안 보이던** 것을
    #   고친 값이다. 반파장 1.30m / 횡변위 0.70m (R≈0.50m, 요구 조향 33.7°)
    #   코스를 작도해 보니 range_max=1.40 에서 세 지점 모두 한쪽이 0개였다:
    #       s=1.2  좌4/우0     s=2.4  좌0/우4     s=3.6  좌4/우0
    #   바깥쪽 벽이 거리 상한의 원호 밖으로 완전히 밀려나기 때문이다.
    #   즉 그 코스에서는 양벽 중심선이 **한 번도 안 만들어지고** 계속 편측
    #   폴백으로 갔다.
    #
    #   코스 전구간을 훑어 "각 벽 3개"에 필요한 거리를 구한 결과:
    #       range 1.40 -> 달성 가능 구간의 23%
    #       range 1.80 -> 56%      range 2.20 -> 84%
    #       range 2.50 -> 100%   ← 여기
    #
    #   ★ side_half_m 을 range_max_m 과 같게 둔 이유:
    #     |y| 조건이 살아 있으면 위 표에서 **달성 가능 지점 자체가**
    #     154개 중 27개로 줄어든다 — 폭 제한이 콘을 먼저 잘라내서, 거리를
    #     아무리 늘려도 3개가 안 되는 지점이 대부분이 된다. 그래서 껐다.
    #     (지우지 않고 남긴 것은 되돌릴 수 있게 하려는 것이다. |y| ≤ 2.50 은
    #      √(x²+y²) ≤ 2.50 에 이미 포함되므로 이 값은 아무것도 안 자른다.)
    #
    #   ⚠️ 옆 벽을 거리로는 못 자른다. 지금은 **콘 모양 필터**
    #      (cluster_max_span_m) 하나가 벽을 막고 있다. 연속된 벽은 span 이
    #      커서 걸러지지만, 기둥·모서리·가림으로 끊긴 0.20m 이하 조각은
    #      콘과 구분되지 않는다 — 옛 0.4 가 실제로 그랬다(아래 주석 참고).
    #      거리를 늘렸으니 그런 조각이 잡힐 기회도 같이 늘었다.
    #      실차에서 debug_show_scan_points:=true 로 켜고 **콘으로 오인된 벽
    #      조각이 있는지 반드시 눈으로 확인할 것.** 있으면 순서대로:
    #        1) cluster_max_span_m 을 0.20 -> 0.15 로 조인다
    #        2) 그래도 남으면 side_half_m 을 1.6 정도로 되돌린다
    #        3) 최후에 range_max_m 을 2.0 으로 내린다 (달성률 63%)

    # --- 클러스터링 + 콘 판별 ---
    # 콘 표면 간 실제 간격 = P - D = 0.325m 이므로 0.15 는 안전하다
    # (이웃 콘이 한 덩어리로 붙지 않는다).
    cluster_gap_m: 0.15
    cluster_min_points: 2
    cluster_max_span_m: 0.20  # 콘 하나의 span 은 0.10m. 옛 0.4 는 벽 조각을 통과시켰다
    cone_merge_dist_m: 0.20   # ★ 반드시 P(0.425) 보다 작아야 한다.
                              #   크면 같은 줄 이웃 콘이 하나로 병합된다

    # --- 좌/우 콘 사슬 (옛 "페어링" 대체) ---
    # 왜 바꿨나: S자에서 **바깥 벽 콘이 r=1.1m 부터 y>0 으로 넘어온다.**
    # 옛 `y > 0.1 / y < -0.1` 분류로는 반대편 줄에 들어가 목표가 뒤집힌다.
    # 사슬 문턱은 P(0.425) < 0.60 < W(0.80) 창의 중앙이라 곡률과 무관하다.
    cone_chain_max_dist_m: 0.60
    chain_extend_m: 0.55      # 폴리라인 끝 연장. 콘 하나가 빠지면 그 너머 콘이
                              # 0.85m 로 잡혀 반대편 벽(0.80m)보다 멀어진다 —
                              # 연장이 그 오배정을 막는다
    chain_reassign_dist_m: 0.30  # 자기 벽 0.03~0.16 vs 반대 벽 >=0.80. 5배 여유
    chain_min_cones: 2

    # --- 중심선 폭 검증 ---
    min_gap_m: 0.70
    # ↑ [사용자 결정 2026-08-22] 0.60 -> 0.70. **좁은 콘 사이로 비집고
    #   들어가던 증상의 직접 원인.** 이 값은 콘 **중심 간** 거리이므로
    #   실제 통과폭은 여기서 지름 D(0.10)를 뺀 값이다:
    #
    #       min_gap 0.60  ->  통과폭 0.50  ->  차폭 0.30 기준 여유 0.10 m/측
    #       min_gap 0.70  ->  통과폭 0.60  ->                여유 0.15 m/측
    #       정상 복도 W 0.80 ->  통과폭 0.70 ->                여유 0.20 m/측
    #
    #   Ld=0.85 의 코너 컷이 R=1.0 에서 0.09m, R=0.6 에서 0.15m 다
    #   (lookahead_dist_m 주석의 표). 0.60 은 **여유보다 코너 컷이 큰**
    #   복도를 "통과 가능"으로 승인하고 있었다 — 그래서 중심선이 생기고,
    #   차는 그 목표를 향해 실제로 못 지나갈 틈으로 들어갔다.
    #
    #   0.70 은 정상 복도 W(0.80)에서 -12.5%. 콘 중심 추정 오차(라이다 점
    #   2~3개에서 나오므로 ±0.03m 수준)와 폴리라인 최근접거리 오차를
    #   덮을 만큼은 남기면서, 못 지나갈 폭은 걷어낸다.
    #   같은 줄 콘끼리 짝짓는 것(P=0.425)은 0.60 때와 마찬가지로 배제된다.
    #
    #   ⚠️ 이 조건에서 떨어진 프레임은 중심선이 없어져 **편측 폴백**
    #      ('wall', 벽 법선으로 0.40m)으로 내려간다. FTG 로 떨어지는 게
    #      아니므로 안전한 열화다. 디버그 영상의 source 가 'center' 에서
    #      'wall' 로 자주 바뀌면 이 값이 과하게 높은 것이다.
    max_gap_m: 0.82
    # ↑ [실측 반영 2026-08-22] 1.00 -> 0.85 -> **0.82**.
    #   ★ 실측으로 전제가 바뀌었다. 코드가 쓰던 P=0.434(A4 규격에서 추정)는
    #     틀렸고, 실측은 **한 칸 건너 두 콘 사이 0.85** -> P = 0.425 다.
    #     그래서 0.85 는 그 거리를 **정확히 통과시킨다**(d <= max_gap).
    #
    #       정상 복도            W   = 0.80   <- 통과해야 함
    #       max_gap             0.82          <- 여기 (양쪽 여유 2~3cm)
    #       같은 줄 한 칸 건너   P*2 = 0.85   <- 막아야 함  [실측]
    #
    #   ⚠️ **창이 5cm 뿐이다.** 콘 중심 추정 오차(라이다 점 2~3개에서
    #      나오므로 ±3cm)와 같은 자릿수라, 이 문턱만으로는 원리적으로
    #      두 경우를 못 가른다. 올려도 내려도 한쪽이 새기 때문에 여기서
    #      더 만질 값이 아니다.
    #   ★ 진짜 방어는 아래 centerline_max_tangent_cos(**방향** 검사)다.
    #      거리로 못 가르는 것을 방향으로 가른다. 이 값은 보조 방벽일 뿐이다.
    #      (검증: 방향검사를 끄면 12개 배치 중 2개에서 가짜 중심선이 남고,
    #       켜면 0개다.)
    centerline_max_tangent_cos: 0.5
    # ↑ [2026-08-22 신규] 좌우 대응이 벽 **접선**과 이루는 |cos| 의 상한.
    #   진짜 복도 대응은 벽에 수직(cos~0)이고, 같은 벽 대응은 접선과
    #   나란하다(재현 사례에서 cos=0.97). 거리로는 못 가르는 것을
    #   방향으로 가른다.
    #     0.5 = 접선과 60도 이상 벌어진 대응만 통과 (기본)
    #     1.0 = 검사 끄기 (2026-08-22 이전 동작)
    #   너무 낮추면 커브에서 진짜 대응까지 탈락해 편측 폴백이 늘어난다.
    single_side_offset_m: 0.40  # = W/2. 한쪽 벽만 보일 때 **법선 방향**으로 미는 양.
                                #   옛 코드는 y축으로만 밀어 커브에서 0.26m 틀렸다

    # --- Pure Pursuit ---
    wheelbase_m: 0.333        # [실측 2026-08-19] 축거 33.3cm (팀원 실측, 프로젝트 공용값과 일치)
    lidar_to_rear_axle_m: 0.41
    # ↑ ★ [실측 2026-08-19, 반영 2026-08-22] 가장 큰 결함이었다.
    #   옛 코드는 **라이다 원점을 뒤축으로 취급**해 Pure Pursuit 을 돌렸다.
    #   라이다가 뒤축보다 41cm 앞이라 alpha 가 과대평가돼 과조향이 났다.
    #   합성검증 실측: 평균 **+7.4~8.0도**, 최대 **+15.9도** 과조향.
    #   좌우 여유가 0.20m 인 복도에서 그 크기는 그대로 지그재그 접촉이다.
    #   steer_gain 을 만져도 안 없어진다 — 기준점 자체가 틀렸기 때문.
    pursuit_ref_offset_m: 0.14
    # ↑ ★ [사용자 결정 2026-08-22] 0.41(뒤축) -> 0.24(차량 중앙) -> **0.14**.
    #   차량 중앙에서 다시 10cm 더 앞으로 당겼다. 조향을 더 세게 받기
    #   위해서다. 기준점이 라이다(0.0)에 가까워질수록 조향은 세진다.
    #     라이다 0.0  ·  **0.14 (현재)**  ·  차량 중앙 0.24  ·  뒤축 0.41
    #   기준이 앞으로 오면 같은 목표점에 대해 alpha 가 커져 **조향이
    #   더 세게 들어간다.** 조향 부족 완화가 목적이다.
    #   ⚠️ 교과서 Pure Pursuit 이 아니다 — delta = atan(2 L sin(a)/ld) 의
    #      유도는 기준이 뒤축일 때만 성립한다. 앞으로 당기면 실질적으로
    #      게인을 올린 것과 같다(위 문단이 경고하는 과조향 방향).
    #      0.14 는 옛 코드의 0.0(라이다 원점, 약 2배 과조향)에 꽤 가깝다 —
    #      지그재그가 나오면 0.24 나 0.41 로 되돌릴 것.
    #      ⚠️ 이 노드는 파라미터를 __init__ 에서 **한 번만** 읽는다.
    #         ros2 param set 은 안 먹는다 — 이 yaml 을 고치고 재시작할 것.
    lookahead_dist_m: 0.85
    # ↑ [사용자 결정 2026-08-22] 0.85 -> 1.10 -> 0.85 -> 1.10 -> **0.90**.
    #   angle_limit 은 35 그대로다(기계적 포화점) — 이 값은 그와 별개로
    #   조정한 것이다. 1.10 과 0.85 사이 절충값.
    #   코너 컷이 ld^2/(8R) 이라 R=0.5m 에서 0.85->0.18m, 0.90->0.20m,
    #   1.10->0.30m (좌우 여유 0.20m). 0.90 은 R=0.5m 급커브의 여유를
    #   거의 다 쓴다 — 그보다 급한 커브면 콘을 스칠 수 있다.
    #   뒤축 기준. 코너 컷 = lookahead^2/(8R), 좌우 여유는 0.20m:
    #              R=1.0    R=0.8    R=0.6    R=0.5
    #     0.75     0.070    0.088    0.117    0.141
    #     0.80     0.080    0.100    0.133    0.160
    #     0.85     0.090    0.113    0.151    0.181   <- 채택
    #   급커브에서 못 꺾고 안쪽 콘을 쳐서 0.80 으로 내려봤지만, 같은 건에서
    #   고친 max_target_step_m 의 clamp 순서 버그 쪽 영향이 훨씬 컸다.
    #   짧게 볼수록 직선 응답이 나빠지므로 0.85 로 되돌린다.
    #   ★ 곡률 적응 lookahead 는 쓰지 않는다 — 코드는 이 값을 **어떤 경우에도
    #     변환하지 않는다.** 유일한 예외는 중심선이 짧아 그 거리의 점이 아예
    #     없을 때이고, 그때는 eff_ld 로 warn 이 찍힌다(진짜 lookahead 변경이
    #     아니라 콘이 멀다는 신호다).
    #   ⚠️ 반파장이 1.5m 뿐이라 이 값이 크면 **변곡점 너머를 겨냥해 S자를
    #      통째로 가로지른다.** 0.85 는 반파장의 28% 앞을 본다.
    lookahead_min_m: 0.3
    # steer_gain: rad -> angle 스케일. [실측 2026-08-19] xycar_motor 의 angle
    # 명령값이 실제 조향각(degree)과 **그대로 일치**함이 확인됐다 —
    # 0->0, 10->10, 20->20, 30->30, 40/50->35(기계적 한계 포화). 부호 반전 불필요.
    # _steer_to_target() 이 만드는 delta_rad 는 이미 물리적으로 올바른 조향각
    # (라디안)이므로, 여기 곱할 값은 임의의 튜닝 상수가 아니라 **라디안->도
    # 변환 상수 그 자체**다: 180/pi = 57.29578.
    # (이전 120.0 은 실측 전 추정치 — "50 명령=19.5도"라는, 나중에 틀린 것으로
    #  확인된 값을 기준으로 잡혀 있었다. driver_node 의 조향 게인도 같은 잘못된
    #  가정 위에 있어 재검토가 필요하다 — README/VEHICLE_TEST.md 참고.)
    steer_gain: 57.29578
    angle_limit: 35.0
    # ↑ [사용자 결정 2026-08-22] 35.0 -> 30.0 -> 35.0 -> 32.0 -> **35.0**.
    #   35 는 기계적 한계 그 자체다(실측: 40/50 명령도 35 에서 포화 —
    #   하드웨어 트림 수정 뒤에도 재확인됨). driver_node.steer.angle_limit /
    #   viz_node.angle_limit 과 같은 값이다.
    #
    #   32 로 낮췄던 이유(서보 조향 첨두 전류로 인한 VESC UNDER_VOLTAGE
    #   완화)는 하드웨어 트림을 물리적으로 고치면서 해소됐다. 아래
    #   UNDER_VOLTAGE 문단은 재발 시 대응 순서로 남겨 둔다.
    #
    #   lookahead_dist_m 을 1.10 으로 올린 것은 이 값과는 무관하다 — 급커브
    #   코너 컷 여유를 보고 따로 튜닝한 값이다.
    #
    #   되돌리는 이유(35 로 돌아갈 때 참고): 30 은 **최소 회전반경을 키운다.**
    #   R = wheelbase / tan(delta):
    #          35도 -> R 0.48m      30도 -> R 0.58m      25도 -> R 0.71m
    #      30 이면 R < 0.58m 인 커브를 구조적으로 못 산다. 급커브에서 못
    #      꺾어 콘을 치는 증상과 정반대 방향의 제약이었다.
    #
    #   ⚠️ 30 으로 낮췄던 근거는 여전히 유효하다 — 라바콘 구간에서 풀록까지
    #      때려박으면 **조향 서보 전류가 레일 전압을 끌어내려 VESC 가
    #      fault code 2(UNDER_VOLTAGE)로 잠겼다**(실차 관측).
    #      35 로 되돌리면 그 조건이 다시 열린다. 재발하면 순서는:
    #        1) base_speed 를 낮춘다 (같은 반경을 더 느리게 = 구동 전류 감소)
    #        2) 그래도 뜨면 여기를 32~33 으로 (30 까지 내리면 위 반경 문제)
    #        3) 배터리 전압 확인
    #      조향 한계를 줄이는 것은 반경을 잃는 대가가 있으니 마지막이다.
    #
    #   ※ 이 값은 속도에도 영향을 준다: 감속식이
    #      base * max(min_speed_ratio, 1 - |angle|/angle_limit) 이므로
    #      분모가 커지면 같은 조향에서 **덜** 감속한다. 다만 min_speed(5.0)
    #      하한이 걸려 있어 실제 차이는 작다.
    invert_steer: false        # [실측 2026-08-19] 반전 불필요 확인됨

    # --- 목표점 안정화 ---
    # ↑ [2026-08-22 사용자 결정] target_smoothing_alpha / max_target_step_m
    #   (EMA + 프레임당 clamp) 을 **없앨다** — 조향이 너무 약하게
    #   들어간다는 판단. 목표점을 다듬지 않고 그대로 Pure Pursuit 에
    #   준다. 대가: 콘 검출이 프레임마다 튀면 조향도 그만큼 튀다.
    # ↑ [튜닝 2026-08-22] 0.12 -> 0.20, **그리고 코드의 적용 순서를 고쳤다.**
    #   예전에는 clamp 를 먼저 걸고 EMA 를 나중에 걸어서 실제 상한이 표기값의
    #   (1-alpha)배 = 0.06 m/frame 이었다. 10Hz 기준 목표 y 가 초당 0.6m 밖에
    #   못 따라간다. 급커브(R=0.6)에서 목표 y 는 0.60m 튀므로 따라잡는 데
    #   1.0초 — 그 사이 차는 0.48m 를 직진한다. **못 꺾고 콘을 치던 원인이다.**
    #   지금은 EMA 를 먼저 걸고 그 결과를 clamp 하므로 이 값이 곧 프레임당
    #   상한이다 (0.20 = 10Hz 기준 2.0 m/s).
    #   0.12 는 좌우가 뒤집히던 옛 페어링(nearest_pair)용 안전망이었다.
    #   지금 사슬 중심선은 훨씬 안정적이라 그만큼 조일 이유가 없다.
    #   ⚠️ pairing_mode 를 nearest_pair 로 되돌릴 때는 이 값도 0.12 로 함께
    #      되돌릴 것 — 그 경로는 목표점이 프레임마다 크게 튄다.

    # --- 속도 ---
    base_speed: 6.0
    min_speed_ratio: 0.4      # 조향이 클수록 감속, 최소 이 배율까지
    lost_speed_ratio: 0.7     # 콘을 못 찾아 FTG 폴백일 때 감속 배율
    min_speed: 5.0
    # ↑ ★ [2026-08-22 신규] **절대** 하한. "멈춘 뒤 다시 안 나가던" 원인이
    #   비율 감속만 있고 이게 없었던 것이다.
    #
    #   센서리스 BLDC 데드밴드 = 1500 ERPM = speed 4.06
    #   (speed_weight 0.08 x speed_to_erpm_gain 4614)
    #
    #       조향  0도 -> 6.00 (2215 ERPM)  돈다
    #       조향 10도 -> 4.00 (1476 ERPM)  ← 여기부터 안 돈다
    #       조향 20도 -> 2.40 ( 886 ERPM)  안 돈다
    #
    #   복도에서 조향 10도는 예사고, **한 번 서면 스캔이 안 바뀌어 조향도
    #   그대로 -> 속도도 그대로**라 스스로 못 빠져나온다.
    #   driver_node 의 speed.min(7.0)은 차선 주행에만 걸린다 — 콘 구간
    #   명령은 SpeedLimiter 를 그냥 통과하므로 하한이 여기 있어야 한다.
    #
    #   ⚠️ 이 값이 걸리면 위 min_speed_ratio 는 사실상 죽는다
    #      (6.0/5.0 이면 비율은 1.00~0.833 만 산다). 데드밴드 아래에는
    #      "천천히"가 없으므로 그게 맞다 — 2.4 는 느린 게 아니라 정지다.
    #   ⚠️ 5.0 = 1846 ERPM. 조향 부하까지 얹혀 이것으로도 끊기면
    #      7.0(2584 ERPM, 8/19 차선 곡선에서 검증된 값)으로 올릴 것.
    #      단 그러면 base_speed 도 7.0 이상이어야 감속이 의미를 갖는다.

    # --- Follow-the-Gap 폴백 (콘을 하나도 못 찾았을 때) ---
    car_width_m: 0.3
    max_steering_angle_rad: 0.4

    # --- 롤백 스위치 ---
    # chain        = 2026-08-22 개편 (좌/우 사슬 + 중심선 + 뒤축 Pure Pursuit)
    # nearest_pair = 그 이전 구현 (콘 1쌍의 중점). 실차 검증은 됐지만 S자에서
    #                좌우가 뒤집힌다. 새 경로가 이상하면 재시작 없이 되돌린다:
    #                    ros2 param set /rubbercone_node pairing_mode nearest_pair
    # ※ 뒤축 변환(lidar_to_rear_axle_m)은 **두 모드 모두에 적용된다** —
    #   옛 경로도 그 오차 위에서 돌고 있었기 때문이다.
    pairing_mode: chain
    pair_max_x_diff_m: 0.5    # nearest_pair 모드 전용

    # --- 구간 진입/이탈 판정 (부채꼴 안 점밀도) ---
    zone_near_m: 0.2
    zone_far_m: 1.5
    zone_half_angle_deg: 55.0
    zone_point_threshold: 20  # 부채꼴 안 점이 이 개수 이상이면 dense
    zone_enter_frames: 5      # dense 가 이만큼 연속되면 진입
    zone_exit_frames: 5       # sparse 가 이만큼 연속되면 이탈

# ---------------------------------------------------------------------------
#  판단 + 제어
# ---------------------------------------------------------------------------
driver_node:
  ros__parameters:
    control_hz: 30.0        # [고정] 제어 주기. 카메라 30fps와 맞춤
    image_width: 640
    # ↑ [실측] 젯슨 실기기에서 /image_raw 로 확인한 실제 폭 (2026-08-16).
    #   튜닝에 쓴 테스트 영상은 632였지만 실차 카메라는 640이다.
    #   차선 오프셋이 이 값의 절반을 화면 중심으로 삼으므로, 틀리면 조향이
    #   계통적으로 한쪽으로 치우친다.
    require_enable: false
    # ↑ [사용자 결정 2026-08-22] launch 만으로 바로 주행하도록 false 로 다.
    #   true 면 /drive_enable 을 받기 전까지 speed 0 을 계속 발행한다.
    #
    #   false 로 둠도 **바로 튀어나가지는 않는다** — fsm.auto_start 가 false 라
    #   WAIT_LIGHT 에서 초록불(또는 좌회전 화살표)을 확정할 때까지 서 있는다.
    #   안전장치가 사라진 게 아니라 신호등으로 옮겨간 것이다.
    #   ⚠️ 다만 **신호등 오검출 한 번에 출발한다.** 벤치에서 차를
    #      들어올리고 테스트할 때는 이 값을 true 로 되돌릴 것.
    #   수동으로 세우려면:
    #     ros2 topic pub --once /drive_enable std_msgs/msg/Bool '{data: false}'
    use_lidar: true
    # ↑ [진단용 스위치] false 면 rubbercone_node 의 /cone_cmd 를 무시하고
    #   **카메라 단독**으로 달린다. 매 tick 읽으므로 재시작 없이 바뀐다:
    #       ros2 param set /driver_node use_lidar false
    #   실차에서 "지금 이상한 게 라이다 때문인가"를 그 자리에서 가르는 용도다.
    #   구간 판정(cone_zone)은 계속 돌아가므로 로그·시각화에 근거는 남는다.
    #   ⚠️ false 로 두면 라바콘 구간을 차선만으로 지나가려 한다. 콘 벽이
    #      흰 실선보다 안쪽이라 **콘을 칠 수 있다.** 진단이 끝나면 반드시
    #      true 로 되돌릴 것. 실전은 무조건 true.

    stale_timeout_sec: 0.5  # [고정] 인지 데이터가 이만큼 끊기면 정지
    lane_lost_stop_sec: 2.0 # [튜닝] 차선을 이만큼 못 보면 정지
    log_period_sec: 1.0

    # --- 상태기계 ---
    fsm:
      start_confirm_frames: 5   # [튜닝] 초록불이 몇 프레임 연속이어야 출발할지
      # --- 좌회전(지름길) 진입 ---
      # 좌회전 화살표를 보면:
      #     ARM_WAIT          LEFT 가 사라질 때까지 평소대로 차선 주행
      #                       = 신호등을 지났다는 **위치 사건**을 기다린다
      #     ARM_GO(arm_sec)   거기서 조금 더 직진 — 분기점까지 가는 거리
      #     TURN_IN(turn_sec) 고정 조향 + 고정 속도로 꺾는다 — 인지 안 봄
      #     -> LANE_DRIVE     복귀. **별도 탈출 기동 없음.**
      #
      # ARM 을 시간이 아니라 LEFT 소실로 끊는 이유: 신호등 본체는 먼 거리에서도
      # conf 0.80~0.88 로 잡히므로 **확정 시점이 신호등에서 몇 m 앞인지가 매번
      # 다르다.** 그 흔들리는 지점에서 시간을 세면 진입 위치가 재현되지 않는다.
      # LEFT 가 사라지는 순간은 신호등이 화면 위로 벗어났다는 뜻이라 속도와
      # 무관한 위치 사건이다.
      # 전부 시간으로 끊는다. 꺾기 시작하면 신호등이 곧 시야를 벗어나
      # LIGHT_LEFT 가 NONE 이 되는데, 신호 유지로 끊으면 진입 도중에
      # 차선주행으로 돌아가 분기를 놓친다.
      enable_shortcut: true
      # ↑ [2026-08-22] false -> **true**. 좌회전을 다시 이 FSM 이 맡는다.
      #     둘 다 켜면 좌회전을 두 번 시도한다.
      #
      #   왜 되돌렸나: 좌회전이 **개루프 고정 조향에서 인지 추종으로** 바뀌었다.
      #   옛 구현(fsm TURN_IN)은 차선을
      #   안 보고 정해진 각도로 정해진 시간 꺾는 방식이라, 진입 위치·속도가
      #   조금만 달라도 회전 반경이 통째로 어긋났고 되돌릴 방법이 없었다.
      #
      #   지금 동작 (총 fsm.shortcut_total_sec = 15초):
      #       SHIFT   0 ~ 1.5s : 목표를 왼쪽으로 shortcut.shift_px(70) 이동.
      #                          1차선으로 붙어 좌측 노란픽셀을 잘 보이게 한다.
      #       FOLLOW  ~ 15s    : 목표 오프셋 0. 계속 좌측밴드 노란선 추종.
      #   두 위상 모두 **좌측밴드 노란선**(lane.left_band_px)을 기준으로 쓴다.
      #
      #   ⚠️ 이 값은 driver_node 생성자에서 **한 번만** 읽는다.
      #      ros2 param set 으로 바꿔도 재시작 전에는 반영되지 않는다.
      #   ⚠️ LIGHT_LEFT 오검출 한 번에 좌회전 분기로 간다. 되돌아오는 데
      #      15초가 걸린다. shortcut_confirm_frames 가 유일한 방어다.
      # --- 출발 신호 (2026-08-22) ---
      start_on_green: true
      start_on_left: true
      # ↑ [사용자 결정] **좌회전 화살표를 봐야 출발한다.** 초록불로는 안 나간다.
      #   둘 다 true 면 둘 중 아무거나로 출발하고, 둘 다 false 면 영영
      #   출발하지 않는다(auto_start 로만 움직인다).
      #
      #   ⚠️ **LEFT 는 SHORTCUT 트리거이기도 하다.** 그래서 출발 직후
      #      화살표가 계속 보이면 shortcut_confirm_frames(3) 만에 곧바로
      #      SHORTCUT 으로 들어간다 — 출발선에서부터 왼쪽으로 70px 붙어
      #      좌측밴드를 따라가기 시작한다는 뜻이다.
      #      좌회전 분기가 출발선에서 15초(shortcut_total_sec) 안에 있어야
      #      말이 된다. 아니라면 start_on_green: true / start_on_left: false
      #      로 되돌리고 평소처럼 초록불로 출발할 것.
      #   ⚠️ 실전 규정이 초록불 출발이면 이 설정은 실격 사유가 될 수 있다.
      #      대회 직전에 반드시 확인할 것.

      shortcut_total_sec: 15.0
      # ↑ [사용자 결정 2026-08-22] **SHIFT 시작부터** 이만큼 유지하고, 끝나면
      #   기본주행(LANE_DRIVE)으로 돌아온다.
      #   **신호가 사라져도 이 시간으로만 끊는다.** 꺾기 시작하면 신호등이
      #   곧 시야를 벗어나 LIGHT_LEFT 가 NONE 이 되는데, 신호 유지로 끊으면
      #   진입 도중에 차선주행으로 돌아가 분기를 놓친다.
      #   ⚠️ 좌회전 + 합류까지 걸리는 실제 시간보다 짧으면 합류 도중에
      #      평소 추정으로 돌아가고, 길면 합류 후에도 좌측밴드를 계속 따라가
      #      차선 왼쪽으로 붙는다. 실차에서 맞출 값이다.
      shortcut_shift_sec: 1.5
      # ↑ 그중 앞부분 — 목표를 왼쪽으로 shortcut.shift_px 만큼 옮겨 1차선으로
      #   붙는 시간. 목적은 회피가 아니라 **시야**다: 트랙 중앙에 있으면
      #   좌회전 차선의 노란선이 화면 왼쪽 끝에 걸리거나 아예 안 잡힌다.
      #   (옛 shortcut_arm_sec / shortcut_turn_sec 는 없어졌다 — 개루프 상수였다.)

      # ── ARM_WAIT: 신호등을 지나칠 때까지 대기 (2026-08-23 부활) ──
      # LEFT 확정만으로는 안 꾫는다. 화살표가 **사라지는 순간**부터 SHIFT 로
      # 들어간다 — 그게 곳 "신호등을 지나쳤다"는 위치 사건이기 때문이다.
      # 확정 시점은 거리가 매번 달라 재현이 안 된다. 그 사이(ARM_WAIT)는
      # 평소대로 일반 추정으로 달린다 — 좌측밴드도 오프셋도 안 쓴다.
      # 총 시간(shortcut_total_sec)도 SHIFT 부터 센다.
      shortcut_lost_frames: 3
      # ↑ LEFT 가 아닌 프레임이 이만큼 연속이어야 "사라졌다"로 본다.
      #   ⚠️ 소실 감지에는 구조적 지연이 있다:
      #      light.miss_tolerance (LightVoter 가 NONE 을 내기까지)
      #      + 이 값 (여기서 소실을 확정하기까지)
      #      더 빨리 반응시키려면 **light.miss_tolerance 를 줄여야** 한다
      #      (그쪽이 지배적이다). 단 그 값은 빨간불 정지 판정에도 영향을 준다.
      shortcut_arm_timeout_sec: 5.0
      # ↑ 안전장치. LEFT 가 끝내 안 사라지면(신호등 앞에 섬 / 화살표가
      #   계속 보이는 각도) 이만큼 지난 뒤 사라진 것으로 치고 SHIFT 로 간다.
      #   여기 갇히면 좌회전을 영영 못 한다.
      shortcut_confirm_frames: 3
      # ↑ [사용자 결정 2026-08-22] 5 -> 3. 좌회전 신호를 **더 잘 읽도록** 낮췄다.
      #   light.min_weight_left / min_ratio_left 와 같은 취지다(그쪽 주석 참고).
      #   ⚠️ 이게 LEFT 오검출에 대한 마지막 방어선이다. 오발동이 보이면
      #      여기부터 되돌릴 것.

      auto_start: false
      # ↑ 신호등 없이 바로 주행. 실내 튜닝용. **실전에서는 반드시 false**

    # TURN_IN 위상 동안 내는 **원시 명령**이다. 이 값이 그대로 모터로 간다 —
    # 차선 오프셋도, 조향 rate limit 도 개입하지 않는다. 그게 목적이다:
    # 분기 초입은 차선이 한쪽만 보이거나 아예 끊겨서, 인지를 믿으면 꺾다
    # 말고 되돌아온다.
    shortcut:
      shift_px: 70.0
      # ↑ [사용자 결정 2026-08-22] SHIFT 위상 동안 목표를 왼쪽으로 옮길 양(px).
      #   회피 기동과 **같은 방식**이다 — 목표만 계단으로 옮기고, 실제 거동은
      #   조향 rate_limit(180도/s)과 LPF 가 만든다.
      #
      #   부호: target_offset 이 **양수면 차가 트랙 왼쪽**에 선다
      #   (lateral.py _offset 주석의 규약). 그래서 왼쪽으로 옮기려면 더한다.
      #   여기는 **크기만** 적고 부호는 코드가 붙인다.
      #
      #   ⚠️ 고정 픽셀이라 트랙 폭·원근이 반영되지 않는다. 너무 크면
      #      좌측 흰 실선을 넘는다. 회피 쪽 shift_left_px(70)와 같은 값이다.
      #
      #   (옛 turn_angle / turn_speed 는 없어졌다 — 고정 조향 경로가 사라졌다.)
      overtake_block_sec: 20.0
      # ↑ [사용자 결정 2026-08-22] 좌회전을 끝낸 뒤 이만큼은 **회피를 하지
      #   않는다.** 분기 직후는 화면 구성이 평소와 달라 YOLO 가 차량을
      #   오검출하기 쉽고, 그때 회피가 걸리면 갓 들어온 길에서 옆으로 벌린
      #   채 달린다. 차단이 걸린 동안 debug_state 의 ot_block 에 남은 초가
      #   뜬다 — "왜 안 피하지"를 화면에서 바로 가를 수 있어야 한다.
      #   벽시계 기준이라 신호 대기로 서 있어도 시간은 흐른다.

    # --- 라바콘 구간 mux ---
    # [2026-08-19 2차 실차] 구간 **판정은 카메라**, 구간 안 **주행은 rubbercone_node**.
    #
    # 왜 바꿨나: 판정을 rubbercone_node(/cone_zone_active)에 맡겼더니 콘이 없는
    # 곳에서도 구간으로 잡혀 제어권이 라이다로 넘어갔고, 차가 차선을 무시하고
    # 이상하게 달렸다. 그 판정은 전방 부채꼴(0.2~1.5m, ±55°) 안 **원본 스캔점**
    # 개수만 세고 콘 모양을 전혀 안 본다(rubbercone_node._update_zone 은 ROI/
    # 클러스터 필터를 안 거친 all_points 를 쓴다). 벽·기둥·사람이면 무엇이든
    # 20점을 쉽게 넘긴다.
    #
    # 지금은 YOLO 콘 개수로 판정한다. /cone_zone_active 는 구독은 하지만
    # 제어에 안 쓰고 debug_state 의 zone_lidar 로만 내보낸다(진단 비교용).
    cone_zone:
      enter_n: 9          # [사용자 결정 2026-08-22] 8 -> 9. 진입을 더 보수적으로
      enter_min_size_px: 100.0
      # ↑ [측정 2026-08-19, 테스트용(신호등미포함).mp4 632x480] 그 콘이 충분히 가까워야 실제로 진입한다 — 가장 큰 콘의 bbox
      #   높이(px)가 이 값 이상이어야 한다. 0 이면 크기 조건을 끈다.
      #
      #   왜 필요한가: 라바콘은 줄지어 서 있어서 **직선 끝에서도 8~13개가 한꺼번에
      #   보인다.** 개수만 보면 구간에 닿기 몇 미터 전에 제어권이 라이다로 넘어가고,
      #   아직 차선 구간인데 콘 복도를 따라가려 들어 엉뚱하게 달린다.
      #
      #   왜 하단 y 가 아니라 높이인가: 하단 y 는 카메라 피치·노면 기울기에 흔들리고
      #   콘이 화면 아래로 잘리면 오히려 작아진다. bbox 높이는 거의 순수한 거리 함수다.
      #
      #   근거(같은 영상 전체를 프레임 단위로 돌린 결과, 이탈은 모두 73.2s 동일):
      #       크기조건 없음 -> 30.5s 진입 (콘 8개, h=24px — 아직 한참 멀다)
      #       60px          -> 40.2s
      #       90px          -> 43.2s
      #       100px         -> 43.4s  ← 채택 (90px 과 6프레임 차이. 사실상 같은 지점)
      #   [2026-08-22 사용자 결정] 90 -> 100. 위 측정대로 진입 시점은 0.2초
      #   늦어질 뿐이고, 조금이라도 늦게 켜는 쪽이 안전한 방향이다.
      #       150px         -> 45.6s  (이미 콘 옆을 지나는 중 — 늦다)
      #   90 과 100 사이는 0.2초 차이뿐이다 — h 가 86px 부근에서 잠시 평평하다가
      #   콘에 닿으면서 급히 커지기 때문(86 -> 91 -> 100 -> 142). 그 급상승 구간
      #   어디를 찍어도 결과가 비슷하다는 뜻이라, 이 근처 값은 안전한 편이다.
      #   [검증] TensorRT FP16 엔진(best5.engine)으로 같은 구간을 다시 재도 콘
      #   개수·높이가 .pt 와 사실상 동일했다(18지점 중 2곳만 콘 1~2개 차이,
      #   진입 시점 43.3s 로 같음). 즉 이 문턱값은 엔진/.pt 공용이다.
      #     개수 조건(8개)은 30.5s 에 이미 찼다. 즉 **13초를 앞당겨 켜지던 것을
      #     크기 조건이 막는다.** 이 구간이 정확히 문제였던 "멀리서 바뀌는" 증상이다.
      #
      #   ⚠️ 이 값은 **카메라 화각·해상도에 종속**이다(위 측정은 632x480 영상).
      #      실차 카메라로 콘 바로 앞에서 debug_state 의 cone_h 를 읽어 확인할 것.
      #      너무 크면 구간에 영영 못 들어가고(로그에 far(cone N, h..px) 가 계속
      #      뜬다), 너무 작으면 멀리서 전환된다.
      exit_n: 3           # [사용자 결정 2026-08-22] 4 -> 6 -> **3**
      # ↑ ⚠️ enter_n(9) 과의 간격이 **3 밖에 안 남는다** (8/4 일 때는 4,
      #      그전 8/2 는 6 이었다). 히스테리시스가 좁을수록 콘 개수가 3개만
      #      출렁여도 구간을 들락거린다. 라바콘 **구간 한가운데서** 제어권이
      #      차선주행으로 넘어가는 것이 최악인데, 그걸 막는 것이 지금은
      #      exit_hold_sec(1.5) 하나뿐이다. 재발하면 그 값을 먼저 키울 것.
      # ↑ [사용자 결정 2026-08-22] 2 -> 4. 구간 끝에서 **더 일찍** 이탈
      #   후보가 된다 — 나가는 판단이 그만큼 빨라진다.
      #   ⚠️ enter_n(8) 과의 간격이 6 -> 4 로 좁아졌다. 히스테리시스 폭이
      #      곧 이 간격이므로, 콘 개수가 4~8 사이에서 흔들리는 구간(특히
      #      구간 중반의 가려짐)에서 이탈 타이머가 자꾸 시작된다.
      #      그걸 실제로 막아주는 건 아래 exit_hold_sec 하나뿐이다 —
      #      구간 중간에 차선주행으로 튀어나가면 exit_hold_sec 를 늘리거나
      #      이 값을 되돌릴 것.
      # ↑ 이탈에는 **크기 조건을 걸지 않는다.** 나갈 때 남은 콘은 멀어지며 작아지는데
      #   크기로도 끊으면 개수보다 먼저 이탈해 아직 콘 사이인 차가 차선으로 돌아간다.
      exit_hold_sec: 1.5
      # ↑ [튜닝] 이탈 조건이 이만큼 지속돼야 실제로 나간다. 구간을 빠져나오는
      #   순간 마지막 콘 몇 개가 시야에서 먼저 사라지는데 차체는 아직 콘 사이에
      #   있다. 이 유지시간이 그 구간을 덮는다. 콘을 지난 뒤에도 라이다 주행이
      #   계속되면 줄이고, 구간 끝에서 조기 복귀해 콘을 치면 늘린다.

    cone_cmd_timeout_sec: 0.5
    # ↑ [튜닝] rubbercone_node 는 /scan 주기(약 10Hz)로 발행하므로 5프레임 여유.
    #   초과하면 **정지**한다(2026-08-21). 차선으로 되돌아가면 콘을 치기 때문 —
    #   우측 콘 벽이 흰 실선보다 안쪽이라 차선 중심을 따라가는 것 자체가
    #   콘으로 들어가는 길이다. 콘 사이에서 멈추는 벌점이 더 낫다.
    #   너무 짧으면 라이다가 한 번 늦을 때마다 정지해 버리므로 주의.

    # --- 횡방향 목표: 추월 서브행동 (카메라 전용, 라이다 사용 안 함) ---
    # [2026-08-19 실차 결정] 회피에서 라이다를 완전히 뺐다.
    # 이전에는 라이다 전방거리로 트리거를 교차확인하고 좌/우 여유로 피할 쪽을
    # 골랐는데, 실차에서 (1) 라이다가 콘·벽·기둥을 방해차량과 구분하지 못해
    # 오발동/미발동이 났고 (2) 옆으로 벌리는 순간 장애물이 섹터에서 빠져
    # front_dist 가 커지면서 PASS 탈출이 즉시 걸려 회피가 무의미해졌다.
    # 방해차량인지는 YOLO만 안다(AvanteN/ionic5). 라이다는 라바콘 구간 전용.
    lateral:
      enable_overtake: true

      # ══════════════════════════════════════════════════════════════
      # [2026-08-22 개편] 램프 기동 -> **차선 변경**
      #
      #   트리거 충족 -> 피할 쪽 결정 -> **즉시** 그 오프셋으로 목표 이동
      #               -> 그 차선 유지 (HOLD)
      #               -> 차가 안 보인 지 lost_hold_sec 지나면
      #                  목표 0 = 노란선(트랙중앙) 추종
      #
      #   위상이 5개(SHIFT/PASS/RETURN/OVERSHOOT/쿨다운)에서 2개
      #   (IDLE/HOLD)로 줄었다. 아래 파라미터도 그만큼 없어졌다:
      #       shift_px, shift_scale, shift_sec, pass_sec, return_sec,
      #       overshoot_sec, overshoot_scale,
      #       pass_exit_ratio, pass_exit_cx_ratio
      #
      #   "즉시" 옮겨도 차가 계단으로 움직이지는 않는다 — 목표만 계단이고,
      #   조향에는 rate_limit(180도/s)과 LPF 가 이미 걸려 있어 거동은
      #   그쪽이 정한다. 예전 shift_sec(0.8s)은 그 위에 램프를 한 겹 더
      #   얹은 것이었고, 그 0.8초 동안에도 차는 방해차량 쪽으로 전진했다.
      # ══════════════════════════════════════════════════════════════

      trigger_height_px: 55.0
      # ↑ 방해차량 bbox 높이(px)가 이 값 이상이면 발동. 거리 대용값이다.
      #   하단 y 를 쓰지 않는 이유: 거리 말고도 카메라 피치·노면 기울기에
      #   흔들리고, 차가 화면 아래로 잘리면 오히려 작아진다. 높이는 거의
      #   순수하게 거리의 함수다 (라바콘 진입이 cone_max_h 를 쓰는 것과 같다).
      #
      #   실측 표본 [2026-08-22] — 서로 다른 두 시점의 사진 (480px 영상):
      #       h=51px (10.6%)  먼 시점
      #       h=67px (14.0%)  가까운 시점
      #   높이는 거리에 반비례하므로 발동 거리는:
      #       67 -> 기준        60 -> 12% 더 멀리        55 -> 22% 더 멀리
      #   [사용자 결정] 67 -> 60 -> **55**. 더 멀리서 시작한다.
      #   ⚠️ 멀수록 bbox 가 작아 YOLO 오검출에도 더 자주 반응한다.
      #      오발동이 잦으면 이 값을 올리거나 car_conf(0.40)를 올릴 것.
      #   ⚠️ 화각·해상도 종속이다. debug_state 의 car_h 로 확인할 것.

      # --- 회피량: 좌/우 **고정** 픽셀 ---
      shift_left_px: 70.0
      shift_right_px: 90.0
      # ↑ [사용자 결정 2026-08-22] 학습 반폭 기반(half_near x 0.25)에서
      #   고정값으로 바꿨다. 좌우가 다른 이유는 차량이 좌측으로 쏠리는
      #   성향이 있어, 오른쪽으로 피할 때 더 크게 밀어야 실제로 같은 만큼
      #   옮겨지기 때문이다(실차 관측).
      #
      #   부호는 코드가 뒤집는다 — _dir(+1=오른쪽으로 피함)과 target_offset 의
      #   부호가 반대다(lateral.py _offset 주석). 여기는 **크기만** 적는다.
      #
      #   ⚠️ 고정 픽셀이라 **트랙 폭·원근이 반영되지 않는다.** 반폭 기반일
      #      때는 목표가 구조적으로 트랙 안쪽이었지만 지금은 그 보장이 없다.
      #      트랙이 좁은 구간에서는 실선을 넘을 수 있으니 키울 때 주의.
      #      참고: 반폭 기반이었다면 half_near 200px 기준 50px 이었다.

      # --- 복귀 ---
      lost_hold_sec: 2.0
      # ↑ 차량이 **안 보이는 상태가 이만큼 이어져야** 트랙 중앙으로 되돌아간다.
      #   [사용자 결정 2026-08-22] 1.0 -> 2.0.
      #   한 프레임만 놓쳐도 복귀하면, 옆으로 옮긴 순간 방해차량이 화면
      #   가장자리로 나가거나 YOLO 가 한 프레임 놓치는 것만으로 기동이
      #   끝난다. 그러면 아직 차 옆을 지나는 중인데 중앙으로 돌아와 부딪힌다.
      #   30fps 기준 60프레임 여유다.
      #
      #   ★ 이것이 **유일한 종료 조건**이다. 예전의 "bbox 가 작아짐 /
      #     화면 가장자리로 밀려남 / pass_sec 시간 상한" 셋은 없앴다.
      #   ⚠️ 즉 **시간 상한이 없다.** 방해차량이 계속 보이면 계속 그 차선을
      #      유지한다. 그게 의도한 동작이지만, YOLO 가 뭔가를 차로 계속
      #      오검출하면 그 차선에 갇힌다는 뜻이기도 하다. 그럴 때는
      #      /drive_enable false 로 세우거나 enable_overtake 를 끌 것.

      cooldown_sec: 1.0
      # ↑ 복귀 후 재발동 금지 시간. 0 이면 복귀 직후 같은 차에 다시 걸려
      #   좌우로 지그재그한다.

    speed:
      base: 15.0
      # ↑ [사용자 결정 2026-08-22] 12.0 -> 15.0 -> 18.0 -> **15.0 으로 되돌림**.
      #   speed 15 ~ 1.20 m/s (speed_weight 0.08). 실효 상한 27 의 56%.
      #   18 은 정상 상태 전류가 커서 VESC fault 2(UNDER_VOLTAGE)가 계속
      #   떴다 — accel 을 5/s 까지 낮춰도 기동 순간만 막을 뿐이었다.
      #   ⚠️ base 를 바꾸면 **곱해지는 감속 계수들이 같이 움직여야** 곡선
      #      속도가 따라 변한다. 이번에 함께 바꾼 것:
      #        accel_per_sec   5.0 -> 6.0   (목표가 낮아져 램프를 조여둘 이유가 준다)
      #        curve_factor_min 0.4 -> 0.5  (15 x 0.5 = 7.5, 18 x 0.4 = 7.2 와 같은 자리)
      #      바꾸지 않은 것: min/limit/kick(모터 데드밴드 기준이라 base 와 무관),
      #        cone_factor_min 0.75(주석의 계산이 이미 15 기준이었다),
      #        quality_factor_min, overtake_factor(비율이라 그대로 따라 내려간다).
      min: 7.0
      # ↑ [실측 2026-08-19] 4.0 -> 7.0. **곡선에서 가다 서다 하던 원인이 이것이다.**
      #   명령 speed 는 컨테이너의 xycar_motor.py 에서 ×0.08 로 m/s 가 되고
      #   ackermann_to_vesc 에서 ×4614 로 ERPM 이 된다:
      #       speed 4 -> 0.32 m/s -> 1477 ERPM
      #       speed 7 -> 0.56 m/s -> 2585 ERPM
      #   센서리스 BLDC 는 1500 ERPM 부근에서 정류 동기를 놓친다. 곡선에서는
      #   조향 저항까지 더해져 부하가 커지므로 그 대역에서 확실히 끊긴다.
      #   직선에서는 speed 12(4429 ERPM)로 달려서 증상이 안 나왔다 —
      #   "직선은 괜찮으니 처리속도 문제는 아니다"라는 관찰과 정확히 맞는다.
      limit: 27.0             # [고정] 위 계산에 따른 실효 상한
      accel_per_sec: 6.0
      # ↑ [사용자 결정 2026-08-22] 8.0 -> 5.0 -> 6.0. 5.0 은 base 18 을
      #   버티려고 조인 값이었다. base 를 15 로 내렸으므로 도달 목표가
      #   낮아져 램프를 그만큼 조일 이유가 줄었다 — 대신 8.0 으로는
      #   돌아가지 않는다(8.0 이 원래 fault 2 를 만든 값이다).
      #       8/s  -> 0 → 15 를 1.9초에 밀어붙인다  (예전에 fault 났던 기울기)
      #       6/s  -> 2.5초에 걸쳐 올린다            (지금)
      #       5/s  -> 3.0초                          (base 18 시절 3.6초와 같은 조임)
      #   (2026-08-19 에 20 -> 8 로 낮춘 것과 같은 이유다. 20/s 는
      #    정지->12 를 0.6초에 밀어붙여 기동 전류가 전압을 끄려내렸다.)
      #
      #   ⚠️ 가속 제한은 **기동 순간**만 막는다. 그래도 fault 2 가 뜨면
      #      범인은 base 의 **정상 상태 전류**다 — 그때는 여기를 더 낮춰도
      #      소용이 없고 base 를 더 내려야 한다(18 -> 15 가 바로 그 조치다).
      #      배터리 전압도 확인할 것.
      decel_per_sec: 60.0
      # ↑ [고정] 감속은 그대로 둔다. 감속은 전류를 **끌어쓰지 않으므로**
      #   fault 2 와 무관하고, 여기를 낮추면 정지 명령(차선 소실·콘 명령 끊김
      #   등)이 났을 때 실제로 서기까지 더 굴러간다.
      #   (60/s -> 12에서 0까지 0.2초, 약 0.1m)

      # 곡률 감속: |offset_far - offset_near| 가 크면 앞이 휘고 있다는 뜻.
      # 카메라에 보이는 만큼만 알 수 있다. 2단계에서 waypoint 곡률로 보강 예정.
      curve_px_lo: 30.0       # [튜닝] 이 값까지는 감속 없음
      curve_px_hi: 150.0      # [튜닝] 이 값에서 최대 감속
      curve_factor_min: 0.5
      # ↑ [사용자 결정 2026-08-22] 0.65 -> 0.5 -> 0.4 -> **0.5**.
      #   base 를 18 -> 15 로 내렸으니 계수를 같이 되돌려야 곡선 속도가
      #   제자리에 남는다(곱해지는 값이라 base 와 한 쌍이다).
      #       15 x 0.5  = 7.5   (0.60 m/s)   <- 지금
      #       18 x 0.4  = 7.2                   base 18 시절
      #       12 x 0.65 = 7.8                   base 12 시절
      #   즉 직선만 12 -> 15 로 빨라지고 곱선 속도는 세 시기 모두 같다.
      #   ⚠️ speed.min 이 7.0 이므로 여기서 더 낮춰도 효과가 거의 없다
      #      (7.5 가 이미 하한 바로 위다). 곱선을 더 느리게 하려면
      #      speed.min 을 같이 낮춰야 한다 — 단 1500 ERPM 근처에서 센서리스
      #      BLDC 가 정류 동기를 놓친다(min 을 4->7 로 올린 근거).
      # ↑ [튜닝 2026-08-19] 0.45 -> 0.65.
      #   ⚠️ 감속 요인은 **곱**이라 곡선에서 두 배로 먹는다. 종전 값이면
      #       12 × 0.45(curve) × 0.5(quality) = 2.7  -> min 으로 끌어올려 4.0
      #   즉 곡선 내내 하한(1477 ERPM)에 붙어 있었다. 0.65 × 0.75 로 바꾸면
      #       12 × 0.65 × 0.75 = 5.85 -> min 7.0
      #   곡선에서도 모터가 도는 대역을 유지한다.

      quality_lo: 0.4         # [튜닝] 차선 품질이 이 아래면 최대 감속
      quality_factor_min: 0.75
      # ↑ [튜닝 2026-08-19] 0.5 -> 0.75. 위 curve_factor_min 과 같은 이유.
      #   곡선에서는 차선 품질도 같이 떨어지므로 두 요인이 항상 함께 바닥을 친다.

      overtake_factor: 0.7    # [튜닝] 회피 기동 중 감속 배율

      kick: 7.0
      # ↑ [2026-08-21] 정지 -> 주행 첫 순간에만 이 속도로 점프한다(이후 정상 램프).
      #   센서리스 BLDC 는 1500 ERPM 아래에서 정류 동기를 못 잡는데, 이 차량
      #   상수(gain 4614 x weight 0.08)로 speed 4.06 = 1500 ERPM 이다.
      #   accel 8/s 로 0 부터 올리면 **첫 0.5초가 통째로 데드밴드**라
      #   모터가 물었다 놨다 하며 깔짝거린다.
      #   ⚠️ 반드시 데드밴드 **위**여야 한다. kick=4.0 은 1476 ERPM 이라
      #      여전히 안이다 — 그 값으로는 증상이 그대로 남는다.
      #      speed.min(7.0 = 2584 ERPM)과 같게 두는 것이 기본이다.
      #   0 으로 두면 이 기능이 꺼진다.
      # ↑ 옆으로 벌리면 전방 장애물이 라이다 섹터에서 빠져 front_dist 가 커지고,
      #   그러면 장애물 상한이 풀려 **가장 위험한 순간에 오히려 가속한다.**
      #   그래서 기동 중에는 명시적으로 눌러둔다. 낮출수록 안전하고 랩타임은 손해.

      cone_n_lo: 2.0          # [튜닝] 라바콘 몇 개부터 감속 시작
      cone_n_hi: 8.0
      cone_factor_min: 0.75
      # ↑ [사용자 결정 2026-08-22] 0.6 -> 0.75. 콘이 보인다고 너무 많이
      #   줄이지 않는다. 구간 **안에서의** 속도는 어차피 rubbercone_node 가
      #   자기 base_speed(6.0)로 따로 정하므로, 이 배율이 지배하는 것은
      #   "콘이 보이기 시작한 접근 구간"뿐이다. 거기서까지 깊게 줄일 이유가
      #   없다. 15 x 0.75 = 11.25 (이전 12 x 0.6 = 7.2 보다 빠르다).
      #   [2026-08-22 base 15 원복 후에도 그대로 둔다 — 이 주석의 계산이
      #    처음부터 15 기준이었다.]

    # --- 조향 제어 ---
    #   steer = k_lat*(offset_near - target) + k_curve*(offset_far - offset_near)
    #           + k_damp*d(error)/dt
    #
    # 두 항의 역할이 다르다 (폐루프 시뮬레이션으로 확인, my_driver/tools/sim_check.py):
    #   k_lat   = 피드백.     지금 벗어난 만큼 되돌린다. 안정성/응답속도를 지배
    #   k_curve = 피드포워드. **곡선의 정상상태 오차를 직접 지운다**
    #
    # 평형 분석 결과:
    #     offset_ss = curvature * (1/K_steer - k_curve) / k_lat
    #   즉 k_curve 가 차량의 조향응답계수(K_steer)의 역수와 같아지면 곡선 오차가 0이 된다.
    #   시뮬레이션에서 K_steer=3.0 일 때 k_curve=0.333 에서 오차 0.1~0.7px 로 사라짐을 확인.
    #   실차의 K_steer 는 알 수 없으므로 아래 절차로 찾는다.
    #
    # ▶ 실차 튜닝 절차 (이 순서를 지킬 것)
    #   1) k_curve=0, k_damp=0 으로 두고 **직선**에서 k_lat 만 올린다.
    #      중앙 복귀가 느리면 키우고, 좌우로 진동하면 줄인다. (시뮬 기준 0.10~0.20 권장)
    #   2) **일정 곡률 코너**를 돌며 k_curve 를 조정한다. 진단이 명확하다:
    #         곡선 바깥으로 밀리면(오차 커짐)  -> k_curve 를 키운다
    #         곡선 안쪽으로 파고들면            -> k_curve 를 줄인다
    #      오차가 0 근처로 가면 그 값이 1/K_steer 다.
    #   3) 남은 떨림을 k_damp 로 잡는다.
    steer:
      k_lat: 0.10             # [튜닝] 키우면 반응 빠름, 너무 크면 진동/조향포화
      k_curve: 0.15           # [튜닝] 곡선 정상상태 오차를 지우는 값. 위 2)로 찾을 것
      k_damp: 0.004           # [튜닝] 진동이 남으면 조금씩 키울 것
      angle_limit: 35.0
      # ↑ [실측 2026-08-21] 50.0 -> 35.0. 명령값 = 조향각(도)이고 **35도에서
      #   기계적으로 포화**한다(40->35, 50->35). 50 으로 두면 제어기 내부
      #   _cmd 가 실제로는 아무 일도 안 일어나는 35~50 구간에 앉을 수 있고,
      #   거기서 반대로 꺾으려면 rate_limit(180/s)로 15 를 되돌리는
      #   **0.083초를 그냥 버린다**(적분 와인드업과 같은 현상).
      #   35 이상은 어차피 안 꺾이므로 조향 권한 손실은 없다.
      #   ⚠️ viz_node.angle_limit 과 tools/sim_check.py 도 같은 값이어야 한다.
      rate_limit_per_sec: 180.0
      # ↑ [튜닝] 초당 조향 변화 상한. 인식이 튀어도(측정상 2.6%) 조향은 급변하지 않게
      lpf_alpha: 0.45         # [튜닝] 저역통과. 크면 응답↑ 떨림↑
      speed_gain_ref: 0.0
      # ↑ [튜닝] 속도 적응 게인. 0이면 비활성. 고속에서 과조향이면 speed.base 값을 넣어볼 것
      invert: true
      # ↑ [확정 2026-08-21 — **바퀴 직접 측정**. 더는 추론이 아니다.]
      #
      #   측정 방법(VEHICLE_TEST §4-0): 주행 노드를 전부 끄고 차를 들어올린 뒤
      #     ros2 topic pub -r 10 /xycar_motor std_msgs/msg/Float32MultiArray \
      #         '{data: [20.0, 0.0]}'
      #   앞바퀴가 **왼쪽**으로 돌았다.  ⇒ 명령 +값 = **좌회전**.
      #
      #   그러면 invert 는 true 여야 한다:
      #     좌커브 -> 트랙중앙이 화면 왼쪽 -> offset_near < 0
      #            -> err = offset_near - target < 0 -> raw < 0
      #     좌커브에서 좌회전하려면 angle > 0 이 나가야 하고,
      #     angle = -raw 이므로 invert = true.
      #
      #   ⚠️ 8/21 에 이 값을 false 로 되돌렸던 근거(S자 우측 이탈 역산)는
      #   **틀렸다.** 역산은 "인지->제어 사이에 다른 반전이 없다"를 전제했는데
      #   그 전제를 검증하지 못한 채 부호만 뒤집은 것이다. 같은 날 실측표
      #   ("양수 명령 = 양수 실측, 왼쪽 기준")와 오늘 측정이 **독립적으로
      #   일치**하므로, 이제 2:1 이 아니라 2:0 이다.
      #   그 우측 이탈의 진짜 원인은 따로 남아 있다 — 아래 '남은 의문' 참고.
      #
      #   ★ 남은 의문: invert:true 는 8/19 낮에 이미 쓰던 값이고, 그 상태에서
      #   S자 우측 이탈이 관측됐다. 부호가 맞다면 그 이탈은 부호 문제가
      #   아니었다는 뜻이다. 후보는 (a) 라이다가 제어권을 뺏고 있었음
      #   (8/19 밤에 확인된 사실. 지금은 콘 구간 밖에서 라이다를 구독조차
      #   하지 않으므로 해소됨), (b) lateral._offset() 회피 부호 버그
      #   (8/21 수정됨), (c) angle_limit 50 의 포화 와인드업 (8/21 35 로 수정됨).
      #   셋 다 그 뒤에 고쳐졌으므로 **재주행으로 확인할 것.**
      #
      #   ⚠️ rubbercone_node.invert_steer 는 **같이 뒤집지 않는다.**
      #   그 노드는 라이다로 자기 조향각을 만들어 /cone_cmd 로 내보내고,
      #   driver_node 는 그것을 이 제어기를 거치지 않고 그대로 통과시킨다
      #   (rubbercone_node.py:332 가 자체 invert_steer 를 적용). 완전히 독립된
      #   경로이고, 그쪽 false 는 팀원이 실차 콘 주행으로 검증한 값이다.

# ---------------------------------------------------------------------------
#  시각화 (my_debug/viz_node) — RViz2 로 보낼 값만. 주행 판단에는 전혀 관여하지 않는다.
# ---------------------------------------------------------------------------
viz_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    # ↑ [고정] SLAM 을 켰다면 /odom_rf2o 로 바꿀 것. 이 토픽이 odom_timeout_sec
    #   동안 안 오면 viz_node 가 명령값 적분(추측항법)으로 대신 그린다.
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser_frame
    rate_hz: 20.0
    odom_timeout_sec: 1.0

    # --- 명령(임의 단위) -> 물리량 환산. 예측 경로를 미터로 그리기 위한 것 ---
    angle_limit: 35.0       # [고정] driver_node.steer.angle_limit 과 같은 값
    max_steer_deg: 35.0     # [실측 2026-08-19] 명령=각도 그대로, 기계적 한계 35도에서 포화
    # ↑ 이전 19.5 는 2026-08-16 초기 커밋(실차 연결 전) 추정치였다. 12개 지점
    #   실측 테이블(0->0, 30->30, 40/50->35 포화)로 틀렸음이 확인됐다.
    #   driver_node.steer 의 게인(k_lat 등)도 그 잘못된 가정 위에서 시뮬레이션
    #   됐을 수 있다 — 실제 조향이 가정보다 거의 2배 민감하다는 뜻이라 재검토 필요.
    speed_to_mps: 0.08      # [실측] 젯슨 기준 speed 12 -> 0.96 m/s
    wheelbase_m: 0.333      # [실측] 축거 33.3cm
    angle_sign: 1.0
    # ↑ [확정 2026-08-21] -1.0 -> 1.0. 위 steer.invert 측정에 따른 동반 수정.
    #   viz 의 자전거 모델은 REP-103(조향각 + = 좌회전)을 쓴다. 실측으로
    #   명령 +값 = 좌회전이 확인됐으니 규약이 이미 같다 -> 뒤집을 필요가 없다.
    #   주행 판단에는 관여하지 않는다. RViz 예측 경로가 실제와 좌우 반대로
    #   보이면 이 부호를 의심할 것.

    plan_horizon_sec: 2.0   # [튜닝] 예측 경로를 몇 초 앞까지 그릴지
    plan_dt: 0.1
    plan_min_speed_mps: 0.3 # [고정] 정지 중에도 조향 방향이 보이게 하는 최소 속도
    driven_path_max_poses: 2000
    driven_path_min_step_m: 0.05

