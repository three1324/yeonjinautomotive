# ============================================================================
#  주행 파라미터 통합 파일
#  이 파일 하나만 고치면 인지/판단/제어 전부 조정된다.
#
#  적용:  ros2 launch my_bringup drive.launch.py
#         (다른 파일을 쓰려면  params_file:=/경로/내파일.yaml)
#
#  형식 주의: ROS2 파라미터 yaml 은 **중첩 구조**로 쓴다.
#             노드에서 "lane.y_lo" 로 선언한 파라미터는 아래처럼 중첩해야 한다.
#                 lane:
#                   y_lo: 270
#             평면으로 "lane.y_lo: 270" 이라고 쓰면 파서가 다르게 해석할 수 있다.
#
#  표기:
#    [실측]  실차에서 반드시 측정해서 넣어야 하는 값. 안 하면 동작이 틀어진다.
#    [튜닝]  실주행 보며 맞추는 값
#    [측정]  영상 분석으로 근거가 확보된 값 (reference/perception_analysis.md)
#    [고정]  근거가 명확해 건드릴 일이 거의 없는 값
# ============================================================================

# ---------------------------------------------------------------------------
#  인지 — 카메라 (YOLO11n-seg 1회 추론)
# ---------------------------------------------------------------------------
perception_node:
  ros__parameters:
    # model_path 는 launch 가 설치 경로로 채워준다. 직접 쓰려면 절대경로.
    model_path: ""
    image_topic: "/image_raw"

    # --- 클래스별 신뢰도 임계값 ---
    infer_conf: 0.20        # [고정] YOLO 자체 임계값. 낮게 두고 아래에서 클래스별로 거른다
    dashed_conf: 0.40       # [측정] 노란 점선. 임계값 0.7까지 올려도 검출률 96% 유지될 만큼 견고
    solid_conf: 0.25        # [측정] 흰 실선. 어두운 구간에서 conf 0.33까지 떨어져 낮게 잡는다
    cone_conf: 0.30         # [튜닝]
    car_conf: 0.40          # [튜닝] 오검출이 추월을 유발하면 올릴 것

    # --- 차선 추정 (lane.py) ---
    # 목표는 "차로 중심"이 아니라 "트랙 중앙"이다. 노란 점선이 트랙 정중앙과
    # 일치하는 것이 338표본으로 확인됨 (오차 +3.0px).
    lane:
      y_lo: 270             # [측정] 샘플 시작행. 지평선 아래
      y_hi: 425             # [측정] 샘플 끝행. 차체(검은 원형)에 가려지는 하단 위
      eval_near: 380
      # ↑ [튜닝 2026-08-19] 400 -> 380. 400 은 y_hi(425) 바로 앞이라 사실상
      #   외삽이었다. 380 이면 표본 범위 270~425 안쪽으로 들어와 내삽이 된다.
      eval_far: 290
      # ↑ [튜닝 2026-08-19] 310 -> 290. 전방주시행. 작을수록(화면 위쪽) 더 멀리
      #   본다 — 곡선을 일찍 알아채 선행 감속·선행 조향이 빨라진다.
      #   ⚠️ 대가가 있다. y_lo(270) 에서 20px 밖에 안 떨어져 있어 표본이 얇고,
      #   지평선 근처라 원근 압축으로 픽셀 노이즈가 크다. |far-near| 가 커지면
      #   speed.curve_px_hi(150) 에 더 자주 걸려 곡선 감속도 깊어진다.
      #   실주행에서 조향이 떨리면 300~310 으로 되돌리거나 y_lo 를 290 으로
      #   올려 표본을 안정시킬 것. (근거: reference/tuning_guide.md §1-1)
      center_bias_px: 0.0
      # ↑ [실측] 카메라 장착 편차 보정. 차를 트랙 중앙에 정지시켜 놓고
      #   perception 로그의 offset 값을 읽어 그 값을 그대로 넣으면 0이 목표가 된다.
      min_pts: 50           # [고정] 피팅에 필요한 최소 픽셀 수
      min_span: 20          # [고정] y 범위가 좁으면 2차 피팅이 폭주하므로 하한
      hold_frames: 15       # [튜닝] 차선 결측 시 직전 값을 유지할 프레임 수
      half_alpha: 0.05      # [고정] 행별 트랙 반폭 EMA 계수
      # --- 이상치 방어 (2026-08-17 추가) ---
      # 피팅이 실패하면 말도 안 되는 값이 나온다. 실측(테스트영상 428프레임):
      #     |offset| 최대 746px, 프레임간 변화 최대 1158px
      # 극단값은 quality 0.9(노란선만 보임) 경로에서 나온다. 급커브에서 좌우
      # 경계선이 번갈아 사라질 때, 화면 밖으로 나가는 부분을 외삽하다가
      # 2차 다항식이 발산하기 때문이다.
      #
      # 적용 효과 (480/250 기준):
      #     |offset| 최대   746 -> 448 px  (40% 감소)
      #     프레임간 최대  1158 -> 249 px  (78% 감소)
      #     차선 유효율    100% 유지 (기각되면 hold가 받쳐줌)
      #
      # ⚠️ 더 조이면 오히려 나빠진다. 기각이 늘어 hold가 길어지고,
      #    풀린 뒤 한 번에 크게 점프한다 (350/150 -> 변화 최대 425px).
      max_center_offset_px: 480.0
      # ↑ [튜닝] 화면 중심에서 이만큼 넘게 벗어난 추정은 피팅 실패로 보고 기각.
      #   화면 폭(640)의 75% 수준. 급커브에서 트랙이 화면 가장자리로 가는 건
      #   정상이지만 그 이상은 외삽 발산이다.
      max_jump_px: 250.0
      # ↑ [튜닝] 직전 채택값에서 이만큼 넘게 튄 추정은 기각.
      #   둘 중 이쪽이 주력이다 (단독으로 1158 -> 249 를 잡음).

    # --- 신호등 투표 (light_vote.py) ---
    # 켜진 LED가 흰색으로 포화되어 색 판별은 불가능하다. 위치(몇 번째 램프)로만
    # 구분되며, 그 판독률이 거리에 의존한다: 박스폭 ~80px 68% / 110px+ 94%.
    # 그래서 단일 프레임을 믿지 않고 누적 투표한다.
    light:
      window: 30            # [튜닝] 투표 창 크기. 30fps 기준 30 = 1초
      min_weight: 3.0       # [튜닝] 확정에 필요한 가중치 합. 높을수록 신중(느림)
      # ⚠️ 절벽 주의. start_sim.py 측정: 6.0 까지는 정상이지만
      #   10.0 에서 3000회 중 1485회가 **10초 안에 출발 못 함**.
      #   출발 대기 위치는 conf 0.54 라 가중치가 잘 안 쌓인다.
      #   "신중하게" 올릴 값이 아니다. 6.0 을 넘기지 말 것.
      min_ratio: 0.6        # [측정] 1위 상태가 차지해야 할 비율
      # ↑ 0.5 -> 0.6. tools/start_sim.py 5000회 몬테카를로:
      #   빨간불 오검출이 전부 GREEN 으로 튀는 최악 가정에서
      #     0.5 -> 조기출발 48회 (실격 위험),  0.6 -> 1회
      #   비용은 출발 지연 +0.14s (p95 0.83 -> 0.97s). 싼 보험이다.
      #   0.6 이상 올려도 조기출발은 더 안 줄고 지연만 늘어난다.
      miss_tolerance: 10    # [튜닝] 이 프레임 수만큼 연속으로 신호등을 못 봐야 NONE

    log_period_sec: 2.0
    publish_debug_image: false

# ---------------------------------------------------------------------------
#  인지 — 라이다
# ---------------------------------------------------------------------------
obstacle_node:
  ros__parameters:
    scan_topic: "/scan"

    # 섹터 각도(도). 라이다 정면 0, 좌측 +(반시계)
    front_lo_deg: -15.0     # [튜닝] 좁히면 민감도↓ 오검출↓
    front_hi_deg: 15.0
    left_lo_deg: 25.0       # [튜닝] 추월 시 차선변경 가능 여부 판단용
    left_hi_deg: 70.0
    right_lo_deg: -70.0
    right_hi_deg: -25.0

    range_min: 0.05         # [실측] 라이다 스펙
    range_max: 10.0         # [실측] YDLidar 유효 최대거리에 맞출 것
    min_points: 3           # [고정] 이보다 적으면 비어있다고 본다 (노이즈 방지)
    publish_viz: true
    # ↑ [고정] /corridor_path(중앙선) + /cone_walls(채택된 벽 점)을 발행한다.
    #   시각화·진단 전용이고 제어에는 쓰지 않는다. 라이다가 10Hz 라 비용은
    #   무시할 만하다. 숫자만 보고는 왜 그 오프셋이 나왔는지 알 수 없으므로
    #   콘 구간 튜닝에는 사실상 필수다.
    log_period_sec: 2.0

    # --- 라바콘 복도 추정 (2026-08-17 추가) ---
    # 라바콘이 좌우 벽을 이루는 구간에서 페인트 차선 대신 콘 복도 중앙을 따라간다.
    # 우측 콘 벽이 흰 실선보다 안쪽이라, 차선 중심을 따라가면 콘을 치기 때문.
    # 출력(/corridor)은 /lane 과 같은 형식(픽셀)이라 driver 가 그대로 섞는다.
    #
    # ⚠️ 아래 값들은 **합성 데이터로만 검증**됐다 (tools/corridor_sim.py, 14케이스).
    #    실제 콘 간격·복도 폭·라이다 반사 특성은 반영 안 됐다.
    #    젯슨에서 rosbag 을 받아 재확정할 것:
    #      ros2 bag record /scan /image_raw -o cone_section
    corridor:
      enabled: true         # [튜닝] 문제 생기면 false 로 꺼서 차선추종만 쓸 수 있다
      x_min: 0.25           # [고정] 이보다 가까운 점은 차체/노이즈
      x_max: 2.2
      # ↑ [튜닝] eval_far(1.5m)보다 조금만 크게. 멀리까지 넣으면 그 구간의 부정확한
      #   추정이 2차 피팅 전체를 끌어당긴다 (합성 검증: 3.0일 때 far 오차 -31px,
      #   2.2로 줄이면 +3px)
      max_lateral: 1.5      # [실측] |y|가 이보다 크면 복도 벽이 아니라고 본다
      min_lateral: 0.06     # [고정] 이보다 가까우면 벽이 아니라 정면 장애물
      bin_size: 0.15
      # ↑ [튜닝] 전방 구간 폭(m). x_max를 줄인 만큼 촘촘히 나눠야 표본이 확보된다.
      #   0.25로 두면 구간이 4개뿐이라 한쪽 벽 결측 시 추정이 통째로 실패한다.
      min_bins: 4           # [고정] 피팅에 필요한 최소 구간 수
      min_span_m: 0.5       # [고정] 구간들이 이만큼은 앞뒤로 퍼져야 피팅
      min_points_per_side: 1
      eval_near_m: 0.6      # [튜닝] 근거리 평가 지점
      eval_far_m: 1.5       # [튜닝] 전방주시 지점
      px_per_meter: 300.0
      # ↑ [실측 필요] 미터 → 픽셀 변환. 다음으로 구한다:
      #     px_per_meter = (lane이 학습한 픽셀 반폭 × 2) / 실측 트랙폭(m)
      #   perception 로그와 줄자만 있으면 되고 호모그래피는 불필요.
      nominal_half_width_m: 0.35
      # ↑ [실측 필요] 한쪽 벽만 보일 때 쓰는 공칭 복도 반폭. 콘 복도 폭의 절반.
      min_both_bins: 3      # [고정] 양쪽 벽 구간이 이만큼 있으면 한쪽만인 구간은 버린다
      hold_frames: 10       # [튜닝] 복도를 못 볼 때 직전 값 유지 프레임
      max_jump_px: 250.0    # [튜닝] 급변 방어. lane과 같은 취지

      # --- 중앙선 추정 사다리 (corridor.py docstring 에 근거) ---
      # 1) walls  좌/우 벽을 각각 피팅 후 중점   2) refine 곡선에 수직으로 재측정
      # 3) bins   구간별 중점을 바로 피팅 (종전)
      # [실측 2026-08-19, 합성 S자] far 평균오차: 종전 91.7px -> 31.2px (완만 S)
      wall_min_bins: 4
      # ↑ [튜닝] 한쪽 벽 독립 피팅에 필요한 최소 구간 수. 3 이하로 낮추면 2차
      #   피팅이 사실상 보간이 되어(점 3개=계수 3개) 노이즈를 그대로 탄다.
      refine_iters: 2       # [튜닝] 법선 재추정 반복. 0이면 비활성(종전 동작)
      refine_samples: 14    # [고정] 재추정 시 곡선을 자르는 지점 수
      path_samples: 12      # [고정] /corridor_path 로 내보낼 중앙선 점 개수

# ---------------------------------------------------------------------------
#  라바콘 구간 전담 — 팀원이 실차에서 성공시킨 구현을 **그대로** 가져왔다
#
#  이 노드는 자족적이다: /scan 을 직접 받아 구간 판정부터 조향·속도까지 다 만든다.
#  차선·카메라와 전혀 엮이지 않는다. driver_node 는 이 노드가 "구간이다"라고
#  하면 그 명령(/cone_cmd)을 xycar_motor 로 **그대로 통과**시키기만 한다.
#
#  ⚠️ 코드는 검증된 원본 그대로다. 아래 값들은 원본 기본값이며, 바꾸려면
#     실차에서 근거를 확인하고 바꿀 것. 특히 wheelbase_m / steer_gain 은
#     원본 주석에 "실측 필요 / 실차 튜닝 필요"라고 적혀 있다.
# ---------------------------------------------------------------------------
rubbercone_node:
  ros__parameters:
    # ★ 가장 중요한 설정 — 모터 토픽에 직접 쏘지 않게 돌린다.
    #   원본 기본값은 'xycar_motor' 였다(원본 주석: "decision_node 생기면 변경").
    #   우리가 바로 그 decision_node 다. 이걸 안 바꾸면 driver_node 와 둘이
    #   같은 토픽에 서로 다른 명령을 쏴서 차가 요동친다.
    drive_topic: cone_cmd
    zone_topic: /cone_zone_active   # driver_node 가 mux 판단에 쓴다
    scan_topic: scan
    debug_topic: /rubbercone/debug_image

    angle_offset_deg: 0.0     # [실측필요] 라이다 장착 각도 보정

    # --- 관심영역 (콘 탐색 범위) ---
    forward_min: 0.15
    forward_max: 2.5
    max_angle_deg: 100.0

    # --- 클러스터링 + 콘 판별 ---
    cluster_gap_m: 0.15
    cluster_min_points: 2
    cluster_max_span_m: 0.4   # ★ 이보다 크면 벽/사람으로 보고 버린다 (콘은 작다)
    cone_merge_dist_m: 0.25

    # --- 좌우 콘 페어링 (핵심 목표점 생성) ---
    pair_max_x_diff_m: 0.5    # 좌우 콘의 전후 거리 차가 이보다 크면 짝이 아님
    min_gap_m: 0.5            # 좌우 간격이 이보다 좁으면 통과 불가로 보고 무시
    single_side_offset_m: 0.35  # 한쪽만 보일 때 반대쪽으로 밀 양

    # --- Pure Pursuit ---
    wheelbase_m: 0.333        # [실측 2026-08-19] 축거 33.3cm (팀원 실측, 프로젝트 공용값과 일치)
    lookahead_min_m: 0.3
    # steer_gain: rad -> angle 스케일. [실측 2026-08-19] xycar_motor 의 angle
    # 명령값이 실제 조향각(degree)과 **그대로 일치**함이 확인됐다 —
    # 0->0, 10->10, 20->20, 30->30, 40/50->35(기계적 한계 포화). 부호 반전 불필요.
    # _steer_to_target() 이 만드는 delta_rad 는 이미 물리적으로 올바른 조향각
    # (라디안)이므로, 여기 곱할 값은 임의의 튜닝 상수가 아니라 **라디안->도
    # 변환 상수 그 자체**다: 180/pi = 57.29578.
    # (이전 120.0 은 실측 전 추정치 — "50 명령=19.5도"라는, 나중에 틀린 것으로
    #  확인된 값을 기준으로 잡혀 있었다. driver_node 의 조향 게인도 같은 잘못된
    #  가정 위에 있어 재검토가 필요하다 — README/VEHICLE_TEST.md 참고.)
    steer_gain: 57.29578
    angle_limit: 35.0          # [실측 2026-08-19] 기계적 한계. 이 이상 명령해도 안 꺾인다
    invert_steer: false        # [실측 2026-08-19] 반전 불필요 확인됨

    # --- 목표점 안정화 (원본 주석: "실차에서 필요했던 안전장치") ---
    target_smoothing_alpha: 0.5
    max_target_step_m: 0.12

    # --- 속도 ---
    base_speed: 6.0
    min_speed_ratio: 0.4      # 조향이 클수록 감속, 최소 이 배율까지
    lost_speed_ratio: 0.7     # 콘을 못 찾아 FTG 폴백일 때 감속 배율

    # --- Follow-the-Gap 폴백 (콘 페어를 못 찾았을 때) ---
    car_width_m: 0.3
    max_steering_angle_rad: 0.4

    # --- 구간 진입/이탈 판정 (부채꼴 안 점밀도) ---
    zone_near_m: 0.2
    zone_far_m: 1.5
    zone_half_angle_deg: 55.0
    zone_point_threshold: 20  # 부채꼴 안 점이 이 개수 이상이면 dense
    zone_enter_frames: 5      # dense 가 이만큼 연속되면 진입
    zone_exit_frames: 5       # sparse 가 이만큼 연속되면 이탈

# ---------------------------------------------------------------------------
#  판단 + 제어
# ---------------------------------------------------------------------------
driver_node:
  ros__parameters:
    control_hz: 30.0        # [고정] 제어 주기. 카메라 30fps와 맞춤
    image_width: 640
    # ↑ [실측] 젯슨 실기기에서 /image_raw 로 확인한 실제 폭 (2026-08-16).
    #   튜닝에 쓴 테스트 영상은 632였지만 실차 카메라는 640이다.
    #   차선 오프셋이 이 값의 절반을 화면 중심으로 삼으므로, 틀리면 조향이
    #   계통적으로 한쪽으로 치우친다.
    require_enable: true
    # ↑ [고정] true면 /drive_enable 을 받기 전까지 speed 0 을 계속 발행한다.
    #   실차에서 갑자기 튀어나가는 것을 막는 안전장치. 실전에서 반드시 true.
    #   시작:  ros2 topic pub --once /drive_enable std_msgs/msg/Bool '{data: true}'
    stale_timeout_sec: 0.5  # [고정] 인지 데이터가 이만큼 끊기면 정지
    lane_lost_stop_sec: 2.0 # [튜닝] 차선을 이만큼 못 보면 정지
    log_period_sec: 1.0

    # --- 상태기계 ---
    fsm:
      start_confirm_frames: 5   # [튜닝] 초록불이 몇 프레임 연속이어야 출발할지
      enable_shortcut: false    # [고정] 지름길 분기. 판단 근거 확정 전까지 비활성
      auto_start: false
      # ↑ 신호등 없이 바로 주행. 실내 튜닝용. **실전에서는 반드시 false**

    # --- 라바콘 구간 mux ---
    # 구간 판정과 주행은 rubbercone_node 가 전담한다(위 섹션). driver_node 는
    # /cone_zone_active 가 true 이고 /cone_cmd 가 살아 있으면 그 명령을 그대로
    # 통과시킨다. 아래는 "그 노드가 죽었다"고 볼 기준일 뿐이다.
    cone_cmd_timeout_sec: 0.5
    # ↑ [튜닝] rubbercone_node 는 /scan 주기(약 10Hz)로 발행하므로 5프레임 여유.
    #   초과하면 차선 주행으로 비상 대체하고 로그에 경고를 남긴다.
    #   너무 짧으면 라이다가 한 번 늦을 때마다 주행 주체가 바뀌어 불안정해진다.

    # --- 차선(카메라) <-> 콘 복도(라이다) 전환 ---
    # [2026-08-19] 두 센서를 **섞지 않는다. 구간에 따라 통째로 갈아탄다.**
    #   콘 구간 밖 -> 차선 단독 (라이다 간섭 0)
    #   콘 구간 안 -> 복도 단독 (차선 안 섞음)
    #
    # 왜 혼합을 그만뒀나: 콘 구간에서는 콘 벽이 실제 주행 가능 경계이고 페인트
    # 차선은 그것과 어긋나 있다(우측 콘 벽이 흰 실선보다 안쪽). 차선을 10%만
    # 섞어도 목표가 콘 쪽으로 밀려 접촉 위험이 생긴다. 반대로 콘 구간 밖에서는
    # 라이다가 트랙 밖 벽·기둥·관중을 잡는다. 각자의 구간에서만 옳은 센서다.
    #
    # 다만 딱 끊으면 전환 순간 목표가 수십~수백 px 점프하고 그게 조향에 실려
    # 차가 휘청인다. 그래서 **전환만** 시간에 걸쳐 부드럽게 한다.
    fusion:
      weight_rate_per_sec: 1.5
      # ↑ [튜닝] 차선<->복도 전환 속도. 0->1 에 최소 0.67초.
      #   목표 가중치는 0 아니면 1 이므로 전환의 부드러움은 전적으로 이 값이
      #   결정한다. 키우면 전환이 빠르지만 튈 위험, 줄이면 부드럽지만
      #   콘 구간 진입 후에도 한동안 차선을 따라가 콘에 붙는다.
      min_corridor_quality: 0.4
      # ↑ [튜닝] 복도 신뢰도가 이보다 낮으면 "복도를 못 만들었다"고 본다.
      #   그러면 콘 구간이어도 차선으로 폴백한다 — 설계 의도가 아니라
      #   콘 구간 한가운데서 멈추는 것을 피하기 위한 비상 경로다.
      #   로그에 자주 뜨면 obstacle_node 의 복도 추정 파라미터를 볼 것.

    # --- 횡방향 목표: 추월 서브행동 (카메라 전용, 라이다 사용 안 함) ---
    # [2026-08-19 실차 결정] 회피에서 라이다를 완전히 뺐다.
    # 이전에는 라이다 전방거리로 트리거를 교차확인하고 좌/우 여유로 피할 쪽을
    # 골랐는데, 실차에서 (1) 라이다가 콘·벽·기둥을 방해차량과 구분하지 못해
    # 오발동/미발동이 났고 (2) 옆으로 벌리는 순간 장애물이 섹터에서 빠져
    # front_dist 가 커지면서 PASS 탈출이 즉시 걸려 회피가 무의미해졌다.
    # 방해차량인지는 YOLO만 안다(AvanteN/ionic5). 라이다는 라바콘 구간 전용.
    lateral:
      enable_overtake: true

      # --- 회피량 ---
      # 목표는 "트랙의 반쪽 중앙" = 트랙중앙 ± 반폭/2 이고, 그 반폭은 인지가
      # 학습해 /lane 으로 보내준다(half_near). 그래서 평소에는 아래 shift_px 를
      # 쓰지 않는다. **좌우 흰선을 동시에 본 적이 없어 반폭이 0 일 때만** 폴백으로
      # 쓴다 — 근거가 약한 값이라 이걸 쓰는 상황 자체가 드물어야 정상이다.
      # (로그의 last_reason 에 shift_px(fallback) 이 자주 뜨면 인지 쪽을 볼 것)
      shift_px: 120.0           # [튜닝] 반폭 미학습 시 폴백 회피량 (픽셀)

      # --- 트리거 (카메라만) ---
      trigger_bottom_y: 300.0   # [튜닝] 차량 bbox 하단 y. 클수록 더 가까워야 발동
      # ↑ 이제 이것이 **유일한 트리거 조건**이다(+ 쿨다운). 라이다 교차확인이
      #   없어졌으므로 YOLO 오검출이 그대로 회피 기동이 된다. 오발동이 잦으면
      #   이 값을 올리거나(더 가까워야 발동) my_perception 의 car_conf 를 올릴 것.
      #   피할 방향도 카메라가 정한다 — 차가 화면 왼쪽이면 오른쪽으로.
      #   회피량이 트랙 반폭의 절반이라 목표가 구조적으로 트랙 안쪽이다.

      # --- 단계별 시간 ---
      shift_sec: 0.8            # [튜닝] 벌리는 데 걸리는 시간
      pass_sec: 1.5             # [튜닝] 벌린 채 통과하는 시간의 **상한**
      # ↑ PASS 는 시간이 아니라 관측으로 끝낸다(차량이 안 보임 / bbox 가 작아짐 /
      #   차량이 화면 가장자리로 밀려남 — 셋 다 카메라 관측이다). 통과 시간은
      #   속도에 따라 달라져 고정 시간으로는 못 맞춘다. 이 값은 그 셋 중
      #   아무것도 안 걸릴 때를 위한 안전 상한이다.
      pass_exit_ratio: 0.85     # [튜닝] bottom_y 가 trigger 의 이 배율 아래면 "지나쳤다"
      # ↑ 1.0 으로 두면 임계 근처에서 진입/이탈이 떨린다. 히스테리시스.
      pass_exit_cx_ratio: 0.85  # [튜닝] 차량이 화면 가장자리로 밀려나면 "지나쳤다"
      # ↑ [실측 2026-08-19] 옆을 스쳐 지나가는 차는 **가까워지면서** 화면 밖으로
      #   나간다(테스트영상 f2741~2811: cx 440->612 인데 bottom_y 는 302->439 로 증가).
      #   그래서 bottom_y 만으로는 통과를 못 잡고 pass_sec 상한까지 벌린 채 달렸다.
      #   이 조건이 있으면 약 0.7초 일찍 트랙 중앙으로 복귀한다.
      return_sec: 1.0           # [튜닝] 복귀 시간
      cooldown_sec: 1.0         # [튜닝] 복귀 후 재발동 금지 시간
      # ↑ 0 이면 복귀 직후 같은 차에 다시 걸려 좌우로 지그재그한다.

    # --- 종방향 목표: 속도 ---
    # 단위는 xycar_motor 의 speed (임의 단위). 변환은 speed_weight=0.08 이므로
    #   speed 12 -> 약 0.96 m/s,  speed 27 -> 약 2.16 m/s
    # VESC ERPM 상한(10000)/gain(4614) = 2.17 m/s 이므로 **27 이상은 의미가 없다**.
    speed:
      base: 12.0              # [튜닝] 기본 목표 속도. 처음엔 낮게 시작할 것
      min: 7.0
      # ↑ [실측 2026-08-19] 4.0 -> 7.0. **곡선에서 가다 서다 하던 원인이 이것이다.**
      #   명령 speed 는 컨테이너의 xycar_motor.py 에서 ×0.08 로 m/s 가 되고
      #   ackermann_to_vesc 에서 ×4614 로 ERPM 이 된다:
      #       speed 4 -> 0.32 m/s -> 1477 ERPM
      #       speed 7 -> 0.56 m/s -> 2585 ERPM
      #   센서리스 BLDC 는 1500 ERPM 부근에서 정류 동기를 놓친다. 곡선에서는
      #   조향 저항까지 더해져 부하가 커지므로 그 대역에서 확실히 끊긴다.
      #   직선에서는 speed 12(4429 ERPM)로 달려서 증상이 안 나왔다 —
      #   "직선은 괜찮으니 처리속도 문제는 아니다"라는 관찰과 정확히 맞는다.
      limit: 27.0             # [고정] 위 계산에 따른 실효 상한
      accel_per_sec: 8.0
      # ↑ [튜닝 2026-08-19] 20.0 -> 8.0. VESC fault code 2 = UNDER_VOLTAGE 대비.
      #   20/s 면 정지->12 를 0.6초에 밀어붙여 기동 전류가 배터리 전압을 끌어내린다.
      #   8/s 면 1.5초에 걸쳐 올린다. 랩타임 손해는 코너당 0.1초 남짓이고,
      #   전압 강하로 모터가 끊기는 손해가 훨씬 크다.
      decel_per_sec: 60.0
      # ↑ [고정] 감속은 그대로 둔다. 감속은 전류를 **끌어쓰지 않으므로**
      #   fault 2 와 무관하고, 여기를 낮추면 stop_dist(0.35m) 앞 제동거리가
      #   길어져 안전이 나빠진다. (60/s -> 12에서 0까지 0.2초, 약 0.1m)

      # 곡률 감속: |offset_far - offset_near| 가 크면 앞이 휘고 있다는 뜻.
      # 카메라에 보이는 만큼만 알 수 있다. 2단계에서 waypoint 곡률로 보강 예정.
      curve_px_lo: 30.0       # [튜닝] 이 값까지는 감속 없음
      curve_px_hi: 150.0      # [튜닝] 이 값에서 최대 감속
      curve_factor_min: 0.65
      # ↑ [튜닝 2026-08-19] 0.45 -> 0.65.
      #   ⚠️ 감속 요인은 **곱**이라 곡선에서 두 배로 먹는다. 종전 값이면
      #       12 × 0.45(curve) × 0.5(quality) = 2.7  -> min 으로 끌어올려 4.0
      #   즉 곡선 내내 하한(1477 ERPM)에 붙어 있었다. 0.65 × 0.75 로 바꾸면
      #       12 × 0.65 × 0.75 = 5.85 -> min 7.0
      #   곡선에서도 모터가 도는 대역을 유지한다.

      quality_lo: 0.4         # [튜닝] 차선 품질이 이 아래면 최대 감속
      quality_factor_min: 0.75
      # ↑ [튜닝 2026-08-19] 0.5 -> 0.75. 위 curve_factor_min 과 같은 이유.
      #   곡선에서는 차선 품질도 같이 떨어지므로 두 요인이 항상 함께 바닥을 친다.

      overtake_factor: 0.7    # [튜닝] 회피 기동 중 감속 배율
      # ↑ 옆으로 벌리면 전방 장애물이 라이다 섹터에서 빠져 front_dist 가 커지고,
      #   그러면 장애물 상한이 풀려 **가장 위험한 순간에 오히려 가속한다.**
      #   그래서 기동 중에는 명시적으로 눌러둔다. 낮출수록 안전하고 랩타임은 손해.

      cone_n_lo: 2.0          # [튜닝] 라바콘 몇 개부터 감속 시작
      cone_n_hi: 8.0
      cone_factor_min: 0.6

      # --- 전방 장애물 상한 (라이다) ---
      stop_dist: 0.35         # [튜닝] 전방 이 거리 이하면 정지 (m)
      slow_dist: 1.2          # [튜닝] 이 거리부터 감속 시작 (m)
      obstacle_cap_in_cone_only: true
      # ↑ [2026-08-19 결정] 위 두 값을 **라바콘 구간에서만** 적용한다.
      #   왜: 라이다는 트랙 밖 벽·기둥·관중과 실제 장애물을 구분하지 못한다.
      #   상시 적용하면 곡선에서 벽이 섹터에 들어올 때마다 STOP 이 걸려
      #   "가다 서다"가 된다. 콘 구간은 통로가 좁아 섹터 안이 곧 콘 벽이라
      #   이 상한이 의미가 있다.
      #   ⚠️ true 면 콘 구간 밖에서는 **전방 비상정지가 없다.** 방해차량은
      #      카메라 회피(lateral)가 담당한다는 전제다. 카메라가 못 보는
      #      장애물까지 막아야 하면 false 로 되돌릴 것.

    # --- 조향 제어 ---
    #   steer = k_lat*(offset_near - target) + k_curve*(offset_far - offset_near)
    #           + k_damp*d(error)/dt
    #
    # 두 항의 역할이 다르다 (폐루프 시뮬레이션으로 확인, my_driver/tools/sim_check.py):
    #   k_lat   = 피드백.     지금 벗어난 만큼 되돌린다. 안정성/응답속도를 지배
    #   k_curve = 피드포워드. **곡선의 정상상태 오차를 직접 지운다**
    #
    # 평형 분석 결과:
    #     offset_ss = curvature * (1/K_steer - k_curve) / k_lat
    #   즉 k_curve 가 차량의 조향응답계수(K_steer)의 역수와 같아지면 곡선 오차가 0이 된다.
    #   시뮬레이션에서 K_steer=3.0 일 때 k_curve=0.333 에서 오차 0.1~0.7px 로 사라짐을 확인.
    #   실차의 K_steer 는 알 수 없으므로 아래 절차로 찾는다.
    #
    # ▶ 실차 튜닝 절차 (이 순서를 지킬 것)
    #   1) k_curve=0, k_damp=0 으로 두고 **직선**에서 k_lat 만 올린다.
    #      중앙 복귀가 느리면 키우고, 좌우로 진동하면 줄인다. (시뮬 기준 0.10~0.20 권장)
    #   2) **일정 곡률 코너**를 돌며 k_curve 를 조정한다. 진단이 명확하다:
    #         곡선 바깥으로 밀리면(오차 커짐)  -> k_curve 를 키운다
    #         곡선 안쪽으로 파고들면            -> k_curve 를 줄인다
    #      오차가 0 근처로 가면 그 값이 1/K_steer 다.
    #   3) 남은 떨림을 k_damp 로 잡는다.
    steer:
      k_lat: 0.10             # [튜닝] 키우면 반응 빠름, 너무 크면 진동/조향포화
      k_curve: 0.15           # [튜닝] 곡선 정상상태 오차를 지우는 값. 위 2)로 찾을 것
      k_damp: 0.004           # [튜닝] 진동이 남으면 조금씩 키울 것
      angle_limit: 50.0       # [고정] xycar_motor angle 상한 (약 19.5도)
      rate_limit_per_sec: 180.0
      # ↑ [튜닝] 초당 조향 변화 상한. 인식이 튀어도(측정상 2.6%) 조향은 급변하지 않게
      lpf_alpha: 0.45         # [튜닝] 저역통과. 크면 응답↑ 떨림↑
      speed_gain_ref: 0.0
      # ↑ [튜닝] 속도 적응 게인. 0이면 비활성. 고속에서 과조향이면 speed.base 값을 넣어볼 것
      invert: true            # [실측] 조향이 반대로 돌아 뒤집음 (2026-08-19 실차)

# ---------------------------------------------------------------------------
#  시각화 (my_debug/viz_node) — RViz2 로 보낼 값만. 주행 판단에는 전혀 관여하지 않는다.
#
#  ⚠️ 아래 corridor.* 세 값은 obstacle_node.corridor 의 같은 이름 값과 **반드시
#     같아야 한다**. viz_node 는 /corridor 가 실어 보낸 픽셀 오프셋을 미터로
#     되돌려 그리는데, 그 환산에 쓰는 값이라 어긋나면 RViz 의 기준 경로만
#     엉뚱한 곳에 그려진다(주행은 정상). obstacle_node 쪽을 바꾸면 여기도 바꿀 것.
#     ROS2 파라미터 yaml 은 노드 간 값 공유(앵커)를 지원하지 않아 복사가 불가피하다.
# ---------------------------------------------------------------------------
viz_node:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /odom
    # ↑ [고정] SLAM 을 켰다면 /odom_rf2o 로 바꿀 것. 이 토픽이 odom_timeout_sec
    #   동안 안 오면 viz_node 가 명령값 적분(추측항법)으로 대신 그린다.
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser_frame
    rate_hz: 20.0
    odom_timeout_sec: 1.0

    # --- 명령(임의 단위) -> 물리량 환산. 예측 경로를 미터로 그리기 위한 것 ---
    angle_limit: 50.0       # [고정] driver_node.steer.angle_limit 과 같은 값
    max_steer_deg: 35.0     # [실측 2026-08-19] 명령=각도 그대로, 기계적 한계 35도에서 포화
    # ↑ 이전 19.5 는 2026-08-16 초기 커밋(실차 연결 전) 추정치였다. 12개 지점
    #   실측 테이블(0->0, 30->30, 40/50->35 포화)로 틀렸음이 확인됐다.
    #   driver_node.steer 의 게인(k_lat 등)도 그 잘못된 가정 위에서 시뮬레이션
    #   됐을 수 있다 — 실제 조향이 가정보다 거의 2배 민감하다는 뜻이라 재검토 필요.
    speed_to_mps: 0.08      # [실측] 젯슨 기준 speed 12 -> 0.96 m/s
    wheelbase_m: 0.333      # [실측] 축거 33.3cm
    angle_sign: -1.0        # [실측] 예측 경로가 실제와 좌우 반대면 부호를 뒤집을 것

    plan_horizon_sec: 2.0   # [튜닝] 예측 경로를 몇 초 앞까지 그릴지
    plan_dt: 0.1
    plan_min_speed_mps: 0.3 # [고정] 정지 중에도 조향 방향이 보이게 하는 최소 속도
    driven_path_max_poses: 2000
    driven_path_min_step_m: 0.05

    corridor:
      px_per_meter: 300.0   # ⚠️ obstacle_node.corridor.px_per_meter 와 같아야 함
      eval_near_m: 0.6      # ⚠️ obstacle_node.corridor.eval_near_m 과 같아야 함
      eval_far_m: 1.5       # ⚠️ obstacle_node.corridor.eval_far_m 과 같아야 함
