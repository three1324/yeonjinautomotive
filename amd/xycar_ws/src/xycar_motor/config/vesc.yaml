# ROS1 noetic_ws/src/vesc/vesc_driver/yaml/vesc.yaml 이식.
#
# speed_min/speed_max(ERPM)는 ROS1 원본(-20000~40000)이 아니라
# reference/docs/모터제어기_VESC_설정방법.pdf(조직위 표준 펌웨어 설정 절차)의
# ERPM 한계값(-1000~10000)에 맞춰 넣었다 — ROS 드라이버가 펌웨어 하드리밋보다
# 넓은 명령을 보내면 안 되므로 펌웨어 쪽 기준을 따른다.
#
# 전압 컷오프(l_min_vin=6V, l_max_vin=30V, l_battery_cut_start=7.5V,
# l_battery_cut_end=6V)는 ROS 드라이버 파라미터가 아니라 old_vesc_tool로
# VESC 펌웨어에 직접 굽는 값이라 이 yaml에는 없다 — PDF 절차대로 실기기에서
# 별도로 설정해야 한다. 현재 reference/vesc/2026_0617_vesc_Motor_cfg.xml 덤프는
# 이 PDF 기준과 다르므로(l_max_vin=15V 등) 실기기 재설정이 필요하다.
#
# ROS2는 전역 파라미터 서버가 없어서 vesc_driver / xycar_motor 두 노드에
# 필요한 값을 각자 네임스페이스 아래 중복 선언한다.

vesc_driver:
  ros__parameters:
    # ── 연결 방식에 따라 경로가 다르다 ──
    #  USB 연결          : /dev/ttyACM0  (udev 규칙으로 /dev/ttyMOTOR 심볼릭 링크)
    #  USB-UART 어댑터   : /dev/ttyUSB0
    #  젯슨 40핀 UART 직결: /dev/ttyTHS1  (JetPack 버전에 따라 ttyTHS0 일 수 있음)
    #
    # ★ 젯슨에서 UART 를 쓸 때 반드시 먼저 할 것 ★
    #  1) 시리얼 콘솔 서비스가 포트를 점유하고 있다. 끄지 않으면 열리지 않는다:
    #        sudo systemctl stop nvgetty && sudo systemctl disable nvgetty
    #        sudo reboot
    #  2) 권한:  sudo usermod -aG dialout $USER   (재로그인 필요)
    #  3) 확인:  ls -l /dev/ttyTHS*
    #
    # 또한 vesc_interface.cpp 에서 흐름제어를 HARDWARE -> NONE 으로 고쳐두었다.
    # UART 에는 RTS/CTS 핀이 없어서 그대로 두면 송신이 막힌다. (해당 파일 주석 참고)
    port: /dev/ttyUSB0
    duty_cycle_min: 0.005
    duty_cycle_max: 0.950
    current_min: -60.0
    current_max: 60.0
    brake_min: 0.0
    brake_max: 0.0
    speed_min: -1000.0
    speed_max: 10000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.15
    servo_max: 0.85

ackermann_to_vesc_node:
  ros__parameters:
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5004

vesc_to_odom_node:
  ros__parameters:
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5004
    publish_tf: true
    # [실측] 앞뒤 바퀴 축간거리, 미터. 2026-08-16 실차 줄자 측정: 33.3cm
    wheelbase: 0.333

xycar_motor:
  ros__parameters:
    speed_max: 10000.0
    speed_min: -1000.0
    speed_to_erpm_gain: 4614.0
    # 아래 캘리브레이션 값은 ROS1에서 항상 0/기본값이었다(rospy.get_param 주석 처리됨).
    # 실차 테스트하면서 조향 중심/속도 오프셋을 여기서 튜닝한다.
    angle_offset: 0.0
    angle_bias_1: 0.0
    angle_bias_2: 0.0
    angle_weight: 0.0068
    speed_bias_1: 0.0
    speed_bias_2: 0.0
    speed_weight: 0.08
