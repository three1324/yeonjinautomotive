# ============================================================================
#  주행 파라미터 통합 파일
#  이 파일 하나만 고치면 인지/판단/제어 전부 조정된다.
#
#  적용:  ros2 launch my_bringup drive.launch.py
#         (다른 파일을 쓰려면  params_file:=/경로/내파일.yaml)
#
#  형식 주의: ROS2 파라미터 yaml 은 **중첩 구조**로 쓴다.
#             노드에서 "lane.y_lo" 로 선언한 파라미터는 아래처럼 중첩해야 한다.
#                 lane:
#                   y_lo: 270
#             평면으로 "lane.y_lo: 270" 이라고 쓰면 파서가 다르게 해석할 수 있다.
#
#  표기:
#    [실측]  실차에서 반드시 측정해서 넣어야 하는 값. 안 하면 동작이 틀어진다.
#    [튜닝]  실주행 보며 맞추는 값
#    [측정]  영상 분석으로 근거가 확보된 값 (reference/perception_analysis.md)
#    [고정]  근거가 명확해 건드릴 일이 거의 없는 값
# ============================================================================

# ---------------------------------------------------------------------------
#  인지 — 카메라 (YOLO11n-seg 1회 추론)
# ---------------------------------------------------------------------------
perception_node:
  ros__parameters:
    # model_path 는 launch 가 설치 경로로 채워준다. 직접 쓰려면 절대경로.
    model_path: ""
    image_topic: "/image_raw"

    # --- 클래스별 신뢰도 임계값 ---
    infer_conf: 0.20        # [고정] YOLO 자체 임계값. 낮게 두고 아래에서 클래스별로 거른다
    dashed_conf: 0.40       # [측정] 노란 점선. 임계값 0.7까지 올려도 검출률 96% 유지될 만큼 견고
    solid_conf: 0.25        # [측정] 흰 실선. 어두운 구간에서 conf 0.33까지 떨어져 낮게 잡는다
    cone_conf: 0.30         # [튜닝]
    car_conf: 0.40          # [튜닝] 오검출이 추월을 유발하면 올릴 것

    # --- 차선 추정 (lane.py) ---
    # 목표는 "차로 중심"이 아니라 "트랙 중앙"이다. 노란 점선이 트랙 정중앙과
    # 일치하는 것이 338표본으로 확인됨 (오차 +3.0px).
    lane:
      y_lo: 270             # [측정] 샘플 시작행. 지평선 아래
      y_hi: 425             # [측정] 샘플 끝행. 차체(검은 원형)에 가려지는 하단 위
      eval_near: 400        # [튜닝] 근거리 평가행. 횡오차 측정 지점
      eval_far: 310         # [튜닝] 전방주시행. 멀수록 곡선을 일찍 보지만 노이즈 증가
      center_bias_px: 0.0
      # ↑ [실측] 카메라 장착 편차 보정. 차를 트랙 중앙에 정지시켜 놓고
      #   perception 로그의 offset 값을 읽어 그 값을 그대로 넣으면 0이 목표가 된다.
      min_pts: 50           # [고정] 피팅에 필요한 최소 픽셀 수
      min_span: 20          # [고정] y 범위가 좁으면 2차 피팅이 폭주하므로 하한
      hold_frames: 15       # [튜닝] 차선 결측 시 직전 값을 유지할 프레임 수
      half_alpha: 0.05      # [고정] 행별 트랙 반폭 EMA 계수
      # --- 이상치 방어 (2026-08-17 추가) ---
      # 피팅이 실패하면 말도 안 되는 값이 나온다. 실측(테스트영상 428프레임):
      #     |offset| 최대 746px, 프레임간 변화 최대 1158px
      # 극단값은 quality 0.9(노란선만 보임) 경로에서 나온다. 급커브에서 좌우
      # 경계선이 번갈아 사라질 때, 화면 밖으로 나가는 부분을 외삽하다가
      # 2차 다항식이 발산하기 때문이다.
      #
      # 적용 효과 (480/250 기준):
      #     |offset| 최대   746 -> 448 px  (40% 감소)
      #     프레임간 최대  1158 -> 249 px  (78% 감소)
      #     차선 유효율    100% 유지 (기각되면 hold가 받쳐줌)
      #
      # ⚠️ 더 조이면 오히려 나빠진다. 기각이 늘어 hold가 길어지고,
      #    풀린 뒤 한 번에 크게 점프한다 (350/150 -> 변화 최대 425px).
      max_center_offset_px: 480.0
      # ↑ [튜닝] 화면 중심에서 이만큼 넘게 벗어난 추정은 피팅 실패로 보고 기각.
      #   화면 폭(640)의 75% 수준. 급커브에서 트랙이 화면 가장자리로 가는 건
      #   정상이지만 그 이상은 외삽 발산이다.
      max_jump_px: 250.0
      # ↑ [튜닝] 직전 채택값에서 이만큼 넘게 튄 추정은 기각.
      #   둘 중 이쪽이 주력이다 (단독으로 1158 -> 249 를 잡음).

    # --- 신호등 투표 (light_vote.py) ---
    # 켜진 LED가 흰색으로 포화되어 색 판별은 불가능하다. 위치(몇 번째 램프)로만
    # 구분되며, 그 판독률이 거리에 의존한다: 박스폭 ~80px 68% / 110px+ 94%.
    # 그래서 단일 프레임을 믿지 않고 누적 투표한다.
    light:
      window: 30            # [튜닝] 투표 창 크기. 30fps 기준 30 = 1초
      min_weight: 3.0       # [튜닝] 확정에 필요한 가중치 합. 높을수록 신중(느림)
      # ⚠️ 절벽 주의. start_sim.py 측정: 6.0 까지는 정상이지만
      #   10.0 에서 3000회 중 1485회가 **10초 안에 출발 못 함**.
      #   출발 대기 위치는 conf 0.54 라 가중치가 잘 안 쌓인다.
      #   "신중하게" 올릴 값이 아니다. 6.0 을 넘기지 말 것.
      min_ratio: 0.6        # [측정] 1위 상태가 차지해야 할 비율
      # ↑ 0.5 -> 0.6. tools/start_sim.py 5000회 몬테카를로:
      #   빨간불 오검출이 전부 GREEN 으로 튀는 최악 가정에서
      #     0.5 -> 조기출발 48회 (실격 위험),  0.6 -> 1회
      #   비용은 출발 지연 +0.14s (p95 0.83 -> 0.97s). 싼 보험이다.
      #   0.6 이상 올려도 조기출발은 더 안 줄고 지연만 늘어난다.
      miss_tolerance: 10    # [튜닝] 이 프레임 수만큼 연속으로 신호등을 못 봐야 NONE

    log_period_sec: 2.0
    publish_debug_image: false

# ---------------------------------------------------------------------------
#  인지 — 라이다
# ---------------------------------------------------------------------------
obstacle_node:
  ros__parameters:
    scan_topic: "/scan"

    # 섹터 각도(도). 라이다 정면 0, 좌측 +(반시계)
    front_lo_deg: -15.0     # [튜닝] 좁히면 민감도↓ 오검출↓
    front_hi_deg: 15.0
    left_lo_deg: 25.0       # [튜닝] 추월 시 차선변경 가능 여부 판단용
    left_hi_deg: 70.0
    right_lo_deg: -70.0
    right_hi_deg: -25.0

    range_min: 0.05         # [실측] 라이다 스펙
    range_max: 10.0         # [실측] YDLidar 유효 최대거리에 맞출 것
    min_points: 3           # [고정] 이보다 적으면 비어있다고 본다 (노이즈 방지)
    log_period_sec: 2.0

    # --- 라바콘 복도 추정 (2026-08-17 추가) ---
    # 라바콘이 좌우 벽을 이루는 구간에서 페인트 차선 대신 콘 복도 중앙을 따라간다.
    # 우측 콘 벽이 흰 실선보다 안쪽이라, 차선 중심을 따라가면 콘을 치기 때문.
    # 출력(/corridor)은 /lane 과 같은 형식(픽셀)이라 driver 가 그대로 섞는다.
    #
    # ⚠️ 아래 값들은 **합성 데이터로만 검증**됐다 (tools/corridor_sim.py, 14케이스).
    #    실제 콘 간격·복도 폭·라이다 반사 특성은 반영 안 됐다.
    #    젯슨에서 rosbag 을 받아 재확정할 것:
    #      ros2 bag record /scan /image_raw -o cone_section
    corridor:
      enabled: true         # [튜닝] 문제 생기면 false 로 꺼서 차선추종만 쓸 수 있다
      x_min: 0.25           # [고정] 이보다 가까운 점은 차체/노이즈
      x_max: 2.2
      # ↑ [튜닝] eval_far(1.5m)보다 조금만 크게. 멀리까지 넣으면 그 구간의 부정확한
      #   추정이 2차 피팅 전체를 끌어당긴다 (합성 검증: 3.0일 때 far 오차 -31px,
      #   2.2로 줄이면 +3px)
      max_lateral: 1.5      # [실측] |y|가 이보다 크면 복도 벽이 아니라고 본다
      min_lateral: 0.06     # [고정] 이보다 가까우면 벽이 아니라 정면 장애물
      bin_size: 0.15
      # ↑ [튜닝] 전방 구간 폭(m). x_max를 줄인 만큼 촘촘히 나눠야 표본이 확보된다.
      #   0.25로 두면 구간이 4개뿐이라 한쪽 벽 결측 시 추정이 통째로 실패한다.
      min_bins: 4           # [고정] 피팅에 필요한 최소 구간 수
      min_span_m: 0.5       # [고정] 구간들이 이만큼은 앞뒤로 퍼져야 피팅
      min_points_per_side: 1
      eval_near_m: 0.6      # [튜닝] 근거리 평가 지점
      eval_far_m: 1.5       # [튜닝] 전방주시 지점
      px_per_meter: 300.0
      # ↑ [실측 필요] 미터 → 픽셀 변환. 다음으로 구한다:
      #     px_per_meter = (lane이 학습한 픽셀 반폭 × 2) / 실측 트랙폭(m)
      #   perception 로그와 줄자만 있으면 되고 호모그래피는 불필요.
      nominal_half_width_m: 0.35
      # ↑ [실측 필요] 한쪽 벽만 보일 때 쓰는 공칭 복도 반폭. 콘 복도 폭의 절반.
      min_both_bins: 3      # [고정] 양쪽 벽 구간이 이만큼 있으면 한쪽만인 구간은 버린다
      hold_frames: 10       # [튜닝] 복도를 못 볼 때 직전 값 유지 프레임
      max_jump_px: 250.0    # [튜닝] 급변 방어. lane과 같은 취지

# ---------------------------------------------------------------------------
#  판단 + 제어
# ---------------------------------------------------------------------------
driver_node:
  ros__parameters:
    control_hz: 30.0        # [고정] 제어 주기. 카메라 30fps와 맞춤
    image_width: 640
    # ↑ [실측] 젯슨 실기기에서 /image_raw 로 확인한 실제 폭 (2026-08-16).
    #   튜닝에 쓴 테스트 영상은 632였지만 실차 카메라는 640이다.
    #   차선 오프셋이 이 값의 절반을 화면 중심으로 삼으므로, 틀리면 조향이
    #   계통적으로 한쪽으로 치우친다.
    require_enable: true
    # ↑ [고정] true면 /drive_enable 을 받기 전까지 speed 0 을 계속 발행한다.
    #   실차에서 갑자기 튀어나가는 것을 막는 안전장치. 실전에서 반드시 true.
    #   시작:  ros2 topic pub --once /drive_enable std_msgs/Bool '{data: true}'
    stale_timeout_sec: 0.5  # [고정] 인지 데이터가 이만큼 끊기면 정지
    lane_lost_stop_sec: 2.0 # [튜닝] 차선을 이만큼 못 보면 정지
    log_period_sec: 1.0

    # --- 상태기계 ---
    fsm:
      start_confirm_frames: 5   # [튜닝] 초록불이 몇 프레임 연속이어야 출발할지
      enable_shortcut: false    # [고정] 지름길 분기. 판단 근거 확정 전까지 비활성
      auto_start: false
      # ↑ 신호등 없이 바로 주행. 실내 튜닝용. **실전에서는 반드시 false**

    # --- 차선(카메라) <-> 콘 복도(라이다) 융합 ---
    # 라바콘 구간에서는 콘 벽이 실제 주행 가능 경계이므로 복도를 따라야 한다.
    # 다만 "콘 보이면 복도, 아니면 차선" 식으로 딱 끊으면 전환 순간 목표가
    # 수십~수백 px 점프하고 그게 그대로 조향에 실려 차가 휘청인다.
    # 그래서 가중치를 두고 시간에 걸쳐 서서히 옮긴다.
    fusion:
      cone_n_lo: 2.0        # [튜닝] 콘이 이 개수 이하면 복도를 안 쓴다
      cone_n_hi: 6.0        # [튜닝] 이 개수 이상이면 복도 비중 최대
      max_corridor_weight: 0.9
      # ↑ [튜닝] 1.0으로 두지 않는 이유: 콘 구간에서도 차선이 보이면 그 정보를
      #   조금 남긴다. 복도만 100% 믿으면 콘이 순간적으로 안 잡힐 때 크게 튄다.
      weight_rate_per_sec: 1.5
      # ↑ [튜닝] 가중치 변화 속도. 0->1 에 최소 0.67초. 전환 점프를 막는다.
      #   키우면 전환이 빠르지만 튈 위험, 줄이면 부드럽지만 콘 구간 진입이 늦다.
      min_corridor_quality: 0.4   # [튜닝] 복도 신뢰도가 이보다 낮으면 안 섞는다

    # --- 횡방향 목표: 추월 서브행동 ---
    # 카메라(차량 확인)와 라이다(거리 확인)를 둘 다 요구한다. 한쪽만 믿으면
    # 오검출로 갑자기 차선을 벗어나는 위험한 동작이 나온다.
    lateral:
      enable_overtake: true
      shift_px: 120.0           # [튜닝] 얼마나 옆으로 벌릴지 (픽셀)
      trigger_bottom_y: 300.0   # [튜닝] 차량 bbox 하단 y. 클수록 더 가까워야 발동
      trigger_front_dist: 1.5   # [튜닝] 라이다 전방 거리 임계 (m)
      side_clearance: 0.6       # [튜닝] 피할 쪽에 필요한 최소 여유 (m)
      shift_sec: 0.8            # [튜닝] 벌리는 데 걸리는 시간
      pass_sec: 1.5             # [튜닝] 벌린 채 통과하는 시간
      return_sec: 1.0           # [튜닝] 복귀 시간

    # --- 종방향 목표: 속도 ---
    # 단위는 xycar_motor 의 speed (임의 단위). 변환은 speed_weight=0.08 이므로
    #   speed 12 -> 약 0.96 m/s,  speed 27 -> 약 2.16 m/s
    # VESC ERPM 상한(10000)/gain(4614) = 2.17 m/s 이므로 **27 이상은 의미가 없다**.
    speed:
      base: 12.0              # [튜닝] 기본 목표 속도. 처음엔 낮게 시작할 것
      min: 4.0                # [튜닝] 감속해도 이 아래로는 안 간다 (멈춤 방지)
      limit: 27.0             # [고정] 위 계산에 따른 실효 상한
      accel_per_sec: 20.0     # [튜닝] 가속 제한
      decel_per_sec: 60.0     # [튜닝] 감속 제한. 가속보다 빠르게 (안전)

      # 곡률 감속: |offset_far - offset_near| 가 크면 앞이 휘고 있다는 뜻.
      # 카메라에 보이는 만큼만 알 수 있다. 2단계에서 waypoint 곡률로 보강 예정.
      curve_px_lo: 30.0       # [튜닝] 이 값까지는 감속 없음
      curve_px_hi: 150.0      # [튜닝] 이 값에서 최대 감속
      curve_factor_min: 0.45  # [튜닝] 최대 감속 배율

      quality_lo: 0.4         # [튜닝] 차선 품질이 이 아래면 최대 감속
      quality_factor_min: 0.5

      cone_n_lo: 2.0          # [튜닝] 라바콘 몇 개부터 감속 시작
      cone_n_hi: 8.0
      cone_factor_min: 0.6

      stop_dist: 0.35         # [튜닝] 전방 이 거리 이하면 정지 (m)
      slow_dist: 1.2          # [튜닝] 이 거리부터 감속 시작 (m)

    # --- 조향 제어 ---
    #   steer = k_lat*(offset_near - target) + k_curve*(offset_far - offset_near)
    #           + k_damp*d(error)/dt
    #
    # 두 항의 역할이 다르다 (폐루프 시뮬레이션으로 확인, my_driver/tools/sim_check.py):
    #   k_lat   = 피드백.     지금 벗어난 만큼 되돌린다. 안정성/응답속도를 지배
    #   k_curve = 피드포워드. **곡선의 정상상태 오차를 직접 지운다**
    #
    # 평형 분석 결과:
    #     offset_ss = curvature * (1/K_steer - k_curve) / k_lat
    #   즉 k_curve 가 차량의 조향응답계수(K_steer)의 역수와 같아지면 곡선 오차가 0이 된다.
    #   시뮬레이션에서 K_steer=3.0 일 때 k_curve=0.333 에서 오차 0.1~0.7px 로 사라짐을 확인.
    #   실차의 K_steer 는 알 수 없으므로 아래 절차로 찾는다.
    #
    # ▶ 실차 튜닝 절차 (이 순서를 지킬 것)
    #   1) k_curve=0, k_damp=0 으로 두고 **직선**에서 k_lat 만 올린다.
    #      중앙 복귀가 느리면 키우고, 좌우로 진동하면 줄인다. (시뮬 기준 0.10~0.20 권장)
    #   2) **일정 곡률 코너**를 돌며 k_curve 를 조정한다. 진단이 명확하다:
    #         곡선 바깥으로 밀리면(오차 커짐)  -> k_curve 를 키운다
    #         곡선 안쪽으로 파고들면            -> k_curve 를 줄인다
    #      오차가 0 근처로 가면 그 값이 1/K_steer 다.
    #   3) 남은 떨림을 k_damp 로 잡는다.
    steer:
      k_lat: 0.10             # [튜닝] 키우면 반응 빠름, 너무 크면 진동/조향포화
      k_curve: 0.15           # [튜닝] 곡선 정상상태 오차를 지우는 값. 위 2)로 찾을 것
      k_damp: 0.004           # [튜닝] 진동이 남으면 조금씩 키울 것
      angle_limit: 50.0       # [고정] xycar_motor angle 상한 (약 19.5도)
      rate_limit_per_sec: 180.0
      # ↑ [튜닝] 초당 조향 변화 상한. 인식이 튀어도(측정상 2.6%) 조향은 급변하지 않게
      lpf_alpha: 0.45         # [튜닝] 저역통과. 크면 응답↑ 떨림↑
      speed_gain_ref: 0.0
      # ↑ [튜닝] 속도 적응 게인. 0이면 비활성. 고속에서 과조향이면 speed.base 값을 넣어볼 것
      invert: false           # [실측] 조향이 반대로 돌면 true
